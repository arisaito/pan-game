<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>10 体重をかけてこねる 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1d13; }
  canvas { display: block; }
  body { font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", system-ui, sans-serif; color: #fff3e0; }
  #panel {
    position: fixed; top: 10px; left: 50%; transform: translateX(-50%);
    width: min(460px, calc(100vw - 40px)); padding: 10px 16px 8px; border-radius: 12px;
    background: rgba(40,25,15,.6); pointer-events: none;
  }
  #row1 { display: flex; justify-content: space-between; align-items: baseline; font-weight: bold; }
  #kval { font-size: 24px; } #kval small { font-size: 13px; }
  #bar { height: 16px; border-radius: 8px; background: rgba(0,0,0,.35); margin: 6px 0; overflow: hidden; }
  #barFill { height: 100%; width: 0; background: linear-gradient(90deg,#d8c39a,#f4d28a,#ffb347); transition: width .2s; }
  #row2 { display: flex; justify-content: space-between; font-size: 12px; }
  #stage { color: #ffe2a8; font-weight: bold; margin-right: 10px; }
  #tip.warn { color: #ff9b80; }
  #shape { display: flex; align-items: center; gap: 8px; font-size: 12px; margin-top: 6px; }
  #shapeBar { position: relative; flex: 1; height: 8px; border-radius: 4px; background: linear-gradient(90deg, rgba(255,226,168,.35), rgba(255,179,71,.6)); }
  #shapeDot { position: absolute; top: -4px; width: 16px; height: 16px; margin-left: -8px; border-radius: 50%; background: #fff3e0; box-shadow: 0 0 4px #000; transition: left .25s; }
  #shapeTick { position: absolute; }
  #shapeDir { min-width: 3em; color: #ffe2a8; }
  #doneSub { white-space: pre-line; }
  /* バランス：真ん中の点が体の傾き。赤い輪の外に出ると転ぶ */
  #bal { position: fixed; right: 18px; bottom: 80px; width: 120px; height: 120px; pointer-events: none; }
  #bal span { position: absolute; bottom: -18px; left: 0; right: 0; text-align: center; font-size: 12px; font-weight: bold; }
  #balRing { position: absolute; inset: 0; border-radius: 50%; border: 4px solid rgba(230,70,50,.8); background: rgba(40,25,15,.55); }
  #balSafe { position: absolute; inset: 30%; border-radius: 50%; border: 2px dashed rgba(130,210,90,.8); }
  #balDot { position: absolute; width: 18px; height: 18px; margin: -9px 0 0 -9px; border-radius: 50%; background: #fff3e0; box-shadow: 0 0 6px #000; }
  #bal.danger #balRing { animation: blink .12s infinite alternate; }
  #gauge {
    position: fixed; top: 102px; left: 50%; transform: translateX(-50%);
    width: min(360px, calc(100vw - 60px)); padding: 7px 10px; border-radius: 10px;
    background: rgba(40,25,15,.6); opacity: 0; transition: opacity .15s; pointer-events: none;
  }
  #gBar { position: relative; height: 14px; border-radius: 7px; background: rgba(255,255,255,.12); overflow: hidden; }
  #gBar div { position: absolute; top: 0; bottom: 0; }
  #gNeedle { width: 4px; margin-left: -2px; background: #fff; box-shadow: 0 0 4px #000; }
  #gPeak { width: 2px; margin-left: -1px; background: rgba(255,255,255,.6); }
  #gauge.danger { animation: blink .12s infinite alternate; }
  @keyframes blink { to { background: rgba(160,30,20,.75); } }
  #pops { position: fixed; inset: 0; pointer-events: none; }
  .pop {
    position: absolute; transform: translate(-50%, -50%); font-weight: 900; white-space: nowrap;
    text-shadow: 0 0 6px rgba(40,20,10,.9), 0 2px 0 rgba(40,20,10,.9); animation: pop 1.1s ease-out forwards;
  }
  @keyframes pop {
    0% { opacity: 1; transform: translate(-50%, -50%) scale(1.4); }
    12% { transform: translate(-50%, -50%) scale(1); }
    70% { opacity: 1; }
    100% { opacity: 0; transform: translate(-50%, -110%) scale(1); }
  }
  #help {
    position: fixed; left: 12px; bottom: 10px; font-size: 12px; line-height: 1.6;
    background: rgba(0,0,0,.4); padding: 6px 10px; border-radius: 8px; pointer-events: none; white-space: pre;
  }
  #done {
    position: fixed; left: 50%; top: 68%; transform: translate(-50%, -50%); display: none;
    background: rgba(40,25,15,.75); padding: 16px 30px; border-radius: 16px; text-align: center;
  }
  #done b { font-size: 32px; display: block; }
</style>
<script type="importmap">
{ "imports": {
  "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
  "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
} }
</script>
</head>
<body>
<div id="panel">
  <div id="row1"><span>こねた度</span><span id="kval">0 <small>/ 100</small></span></div>
  <div id="bar"><div id="barFill"></div></div>
  <div id="row2"><span><span id="stage"></span><span id="tip"></span></span><span id="stat"></span></span></div>
  <div id="shape"><span>まる</span><div id="shapeBar"><div id="shapeDot"></div></div><span>ほそなが</span><span id="shapeDir"></span></div>
</div>
<div id="gauge"><div id="gBar">
  <div id="zGood" style="background:rgba(130,210,90,.8)"></div>
  <div id="zEdge" style="background:rgba(255,190,70,.85)"></div>
  <div id="zTear" style="background:rgba(230,70,50,.9)"></div>
  <div id="gPeak"></div><div id="gNeedle"></div>
</div></div>
<div id="pops"></div>

<div id="done"><b>こね上がり！</b><span id="doneSub"></span></div>
<div id="help"></div>
<div id="bal"><div id="balRing"></div><div id="balSafe"></div><div id="balDot"></div><span>バランス</span></div>
<script type="module">
import * as THREE from 'three';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

const $ = id => document.getElementById(id);

// =====================================================================
// 設定
// =====================================================================
const CFG = {
  // ---- 手 ----
  // 体（10）：踏み台の上の上半身
  hip: new THREE.Vector3(0, 2.4, 7.4), // 腰（踏み台の上）
  torsoLen: 2.8, shoulderHalf: 1.35,
  leanFwd: 0.5, leanSide: 0.35, // 左スティックで傾けられる角度（ラジアン）
  tipG: 9,                    // 倒れようとする力（重力）
  muscle: 6.3,                // 踏ん張る力（tipG より小さい＝放っておくと倒れる。スティックで立て直す）
  bodyD: 5,                   // 体の揺れの減衰
  wobble: 1.5,                // 踏み台のぐらつき（ランダム。放っておくと4〜6秒で倒れる）
  support: 5,                // 手で押さえた時の支え（1本あたり、押さえる強さ×）
  fallFwd: 0.78, fallBack: 0.45, fallSide: 0.6, // これ以上傾くと転ぶ
  twist: 0.5,                 // 右スティック左右でひねれる角度
  reachTorque: 4.5,           // 腕を前に伸ばすと前のめりになる強さ（縮めると後ろへ）
  reachKick: 0.9,             // 腕を急に伸ばした反動
  twistTorque: 5.0,           // ひねると横に振られる強さ
  twistKick: 1.2,             // 急にひねった反動
  reach0: 7.0, reach1: 2.4,   // 腕の届く距離（ふだん ± 右スティック上下）
  leanReach: 2.6,             // 前に傾くと手がさらに奥へ
  inward: 0.6,                // 手は肩より少し内側（ふだんは生地の左右の端の上）
  elbowOut: 0.55,             // ひじの張り出し
  pressBase: 0.35,            // 傾いていなくても押せる強さ（残りは前傾で乗る体重）
  pressDepth: 0.9,            // 押さえつけで手が下がる深さ（生地がつぶれる）
  FLAT_RATE: 0.045,           // 押さえながら動かした距離あたり、生地が平たくなる量
  FLAT_MAX: 1.5,              // 平たさの上限（厚さ約 1/4.5）
  jointK: 45, jointD: 11,     // ひねり・腕の伸びのバネ（ゆっくりめ＝手が速くなりすぎない）
  handOffset: 0.5,
  handK: 80, handD: 8,        // ぶら下がった手のバネ
  contactR: 0.75,             // 手のひらが生地に触れる半径
  stick: 0.7,                 // 押さえながらゆっくり動かした時、生地が手についてくる割合
  stickLight: 0.08,           // 押さえていない時（軽く触れているだけ）
  hitSpeed: 8,                // 手がこれより速いと、生地を弾く（ふつうに体を動かすくらいでは弾かない）
  hitK: 0.7,                  // 弾く強さ
  deadzone: 0.12, stickCurve: 1.0,
  handSpring: 15,             // 手の上下の追従
  grabR: 0.75,                // 手の真下この半径に生地があればつかめる
  grabCluster: 0.6,           // つかんだ点の周りこの半径をまとめて持つ

  // ---- 生地（粒子＋塑性バネ、3D） ----
  spacing: 0.42,
  doughRX: 1.35, doughRY: 1.0,
  gravity: 26,
  damping: 0.985,
  iterations: 8,
  groundFric: 0.35,           // まな板の摩擦（1で止まる）
  FLOW_BOOST: 40,             // 強く伸ばされると生地が流れて伸びる（大きく広げても見た目が破綻しない）

  // ---- 伸ばす ----
  // 張り = 両手でつかんでから広げた距離 ÷ 伸ばせる長さ（ALLOW）
  //   0.3〜0.65 いい伸び ／ 0.65〜1.0 ギリギリ ／ 1.0 超えが TEAR_HOLD 秒続くとちぎれる
  //   限界(1.15)より先には手が広がらない（生地が引っぱり返す）
  ALLOW: 5.5,                 // 伸ばせる長さ（こね始め）
  ALLOW_GROW: 0.5,            // こねるほど伸ばせる（こね上がりで1.5倍）
  GOOD_LO: 0.3, GOOD_HI: 0.65, TEAR: 1.0,
  STRETCH_CAP: 1.15,
  TEAR_HOLD: 0.35,            // 限界を超えた状態がこの秒数続くとちぎれる（すぐ緩めればセーフ）
  BONUS_GOOD: 4, BONUS_EDGE: 7,


  GAIN: 0.002,                // じわじわ分

  // ---- こね方でパンの形が変わる ----
  // 両手でつかんで動かす向きで形が決まる：上下（奥⇄手前）ばかり → 横長に伸びてフランスパン
  //                                       上下も左右も → 丸くまとまって丸パン
  SHAPE_RATE: 0.02,           // 両手で動かした距離あたりの形の変わり方
  KNEAD_PER_MOVE: 1.2,        // 両手で動かした距離あたりのこねた度
  SHAPE_MAX: 1.4,             // 細長さの上限（約4倍）
  BAGUETTE_AT: 0.7,           // こね上がりの時、細長さがこれ以上ならフランスパン

  // ---- まな板・失敗 ----
  BW: 7, BD: 4.4,
  FALL_FRAC: 0.6,
  FAIL_SHOW: 0.8,
};

const STAGES = [
  { at: 0, name: 'べたべた' }, { at: 20, name: 'まとまってきた' },
  { at: 50, name: 'なめらか' }, { at: 80, name: 'グルテン膜' }, { at: 100, name: 'こね上がり' },
];
const stageOf = v => { let s = STAGES[0]; for (const st of STAGES) if (v >= st.at) s = st; return s; };

// =====================================================================
// three.js
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a1d13');
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
const camBase = new THREE.Vector3();
scene.add(new THREE.HemisphereLight('#fff4e0', '#5a3a20', 0.9));
const sun = new THREE.DirectionalLight('#fff1dc', 1.6);
sun.position.set(-3, 16, 5); sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 9, bottom: -9, near: 1, far: 40 });
scene.add(sun);

function woodTexture(w, h, base, seed0) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const b = c.getContext('2d');
  b.fillStyle = base; b.fillRect(0, 0, w, h);
  let seed = seed0; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 90; i++) {
    const y0 = rnd() * h, amp = 2 + rnd() * 8, freq = 0.003 + rnd() * 0.008, ph = rnd() * 6;
    b.strokeStyle = `rgba(${110 + rnd() * 40 | 0},${65 + rnd() * 30 | 0},25,${0.06 + rnd() * 0.14})`;
    b.lineWidth = 1 + rnd() * 3; b.beginPath();
    for (let x = 0; x <= w; x += 8) { const y = y0 + Math.sin(x * freq + ph) * amp; x ? b.lineTo(x, y) : b.moveTo(x, y); }
    b.stroke();
  }
  for (let i = 0; i < 2500; i++) {
    b.fillStyle = `rgba(255,252,240,${rnd() * 0.22})`;
    b.beginPath(); b.arc(rnd() * w, rnd() * h, rnd() * 2.2, 0, 7); b.fill();
  }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const counter = new THREE.Mesh(new THREE.BoxGeometry(60, 1, 40),
  new THREE.MeshStandardMaterial({ map: woodTexture(1024, 1024, '#5b3f29', 3), roughness: 0.9 }));
counter.position.y = -1.0; counter.receiveShadow = true; scene.add(counter); // 上面 y=-0.5
const boardMat = new THREE.MeshStandardMaterial({ map: woodTexture(1600, 1000, '#d9ab72', 7), roughness: 0.75 });
const sideMat = new THREE.MeshStandardMaterial({ color: '#b98650', roughness: 0.8 });
const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(CFG.BW * 2, 0.5, CFG.BD * 2), [sideMat, sideMat, boardMat, sideMat, sideMat, sideMat]);
boardMesh.position.y = -0.25; boardMesh.receiveShadow = true; boardMesh.castShadow = true;
scene.add(boardMesh);
// ふちの警告ライン
const edgeLine = new THREE.LineSegments(
  new THREE.EdgesGeometry(new THREE.PlaneGeometry(CFG.BW * 2, CFG.BD * 2)),
  new THREE.LineBasicMaterial({ color: '#ff5a3c', transparent: true, opacity: 0 }));
edgeLine.rotation.x = -Math.PI / 2; edgeLine.position.y = 0.02; scene.add(edgeLine);

// ---- 生地の見た目（マーチングキューブで粒子をなめらかな塊に） ----
const MC_S = 5.6, MC_RES = 46;
const doughMat = new THREE.MeshStandardMaterial({ color: '#e6d2a8', roughness: 0.85 });
const mc = new MarchingCubes(MC_RES, doughMat, false, false, 90000);
mc.scale.set(MC_S, MC_S, MC_S);
mc.castShadow = true; mc.receiveShadow = true;
mc.isolation = 80;
scene.add(mc);
const BALL_STRENGTH = 0.06, BALL_SUB = 12;

// 落ちて消えていく生地（失敗時）
const ghostMat = new THREE.MeshStandardMaterial({ color: '#e6d2a8', roughness: 0.85, transparent: true });
const ghostGeo = new THREE.SphereGeometry(1, 10, 8);
let ghosts = [];

// ---- 焼き上がったパン ----
let bread = null, bakeT = 0;
const crustMat = new THREE.MeshStandardMaterial({ color: '#c47a33', roughness: 0.55 });
const cutMat = new THREE.MeshStandardMaterial({ color: '#f1cf8e', roughness: 0.8 });
function clearBread() {
  if (bread) { scene.remove(bread); bread = null; }
  bakeT = 0; mc.visible = true;
}
function makeBread(type, along) {
  const g = new THREE.Group();
  if (type === 'baguette') {
    // 細長いフランスパン：長いカプセル＋斜めのクープ
    const body = new THREE.Mesh(new THREE.CapsuleGeometry(0.62, 4.6, 10, 24), crustMat);
    body.rotation.x = Math.PI / 2; body.scale.set(1, 1, 0.78);
    g.add(body);
    for (let i = -2; i <= 2; i++) {
      const cut = new THREE.Mesh(new THREE.CapsuleGeometry(0.09, 0.9, 4, 8), cutMat);
      cut.rotation.set(Math.PI / 2, 0, 0.6);
      cut.position.set(0, 0.47, i * 0.95);
      g.add(cut);
    }
    if (along === 'x') g.rotation.y = Math.PI / 2;
    g.position.y = 0.5;
  } else {
    // 丸パン：ころんとした丸＋十字のクープ
    const body = new THREE.Mesh(new THREE.SphereGeometry(1.45, 32, 24), crustMat);
    body.scale.set(1, 0.72, 1);
    g.add(body);
    for (const r of [Math.PI / 4, -Math.PI / 4]) {
      const cut = new THREE.Mesh(new THREE.CapsuleGeometry(0.1, 1.3, 4, 8), cutMat);
      cut.rotation.set(Math.PI / 2, 0, r);
      cut.position.y = 1.02;
      g.add(cut);
    }
    g.position.y = 1.0;
  }
  g.traverse(o => { if (o.isMesh) { o.castShadow = true; o.receiveShadow = true; } });
  return g;
}
function updateBake(dt) {
  if (!bakeT) return;
  bakeT += dt;
  if (!bread && bakeT > 0.7) {
    const type = Math.abs(elong) >= CFG.BAGUETTE_AT ? 'baguette' : 'round';
    const c = parts.length ? centroid() : new THREE.Vector3();
    bread = makeBread(type, elong >= 0 ? 'x' : 'z');
    bread.position.x = THREE.MathUtils.clamp(c.x, -CFG.BW + 2.5, CFG.BW - 2.5);
    bread.position.z = THREE.MathUtils.clamp(c.z, -CFG.BD + 2.5, CFG.BD - 2.5);
    bread.userData.t = 0;
    scene.add(bread);
    mc.visible = false;
    puff(bread.position.clone().setY(0.3), 60, 1.4);
    rumble(0.8, 0.8, 250);
    const name = type === 'baguette' ? 'フランスパン' : '丸パン';
    $('done').querySelector('b').textContent = name + 'ができた！';
    $('doneSub').textContent = (type === 'baguette' ? '同じ向きにばかりこねて、細長く伸びた。' : '上下にも左右にもこねて、丸くまとまった。')
      + `\nタイム ${fmtTime(endTime - startTime)}　失敗 ${fails}回　Start / R でもう一度`;
    $('done').style.display = 'block';
  }
  if (bread) {
    bread.userData.t += dt;
    const k = Math.min(1, bread.userData.t / 0.35);
    bread.scale.setScalar(0.3 + 0.7 * (1 - Math.pow(1 - k, 3)) + Math.sin(Math.min(1, bread.userData.t / 0.6) * Math.PI) * 0.08);
  }
}

// ---- 手 ----
const skinMat = new THREE.MeshStandardMaterial({ color: '#f1c49c', roughness: 0.65 });
const sleeveMats = [new THREE.MeshStandardMaterial({ color: '#4a8fd8', roughness: 0.8 }), new THREE.MeshStandardMaterial({ color: '#d8604f', roughness: 0.8 })];
function makeHandModel(i) {
  const side = i === 0 ? -1 : 1;
  const root = new THREE.Group(), g = new THREE.Group();
  root.scale.setScalar(1.35);
  g.scale.x = side; root.add(g);
  const palm = new THREE.Mesh(new THREE.SphereGeometry(0.5, 20, 14), skinMat);
  palm.scale.set(1, 0.42, 1.05); g.add(palm);
  const fingers = [];
  for (let k = 0; k < 4; k++) {
    const pv = new THREE.Group(); pv.position.set(-0.31 + k * 0.21, -0.02, -0.44);
    const len = [0.34, 0.42, 0.4, 0.3][k];
    const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.095, len, 6, 10), skinMat);
    f.rotation.x = Math.PI / 2; f.position.z = -len / 2 - 0.04;
    pv.add(f); g.add(pv); fingers.push(pv);
  }
  const thumbPv = new THREE.Group(); thumbPv.position.set(-0.45, -0.04, -0.04);
  const thumb = new THREE.Mesh(new THREE.CapsuleGeometry(0.11, 0.3, 6, 10), skinMat);
  thumb.rotation.z = Math.PI / 2; thumb.position.x = -0.2; thumbPv.add(thumb); g.add(thumbPv);
  g.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(root);
  const ring = new THREE.Mesh(new THREE.RingGeometry(0.42, 0.55, 32),
    new THREE.MeshBasicMaterial({ color: side < 0 ? '#7fb6ff' : '#ff9a8a', transparent: true, opacity: 0.6, depthWrite: false }));
  ring.rotation.x = -Math.PI / 2; scene.add(ring);
  return { root, g, fingers, thumbPv, ring };
}

// ---- 腕（肩・上腕・ひじ・前腕）：関節が見えるように ----
function cylBetween(mesh, a, b) {
  const d = b.clone().sub(a); const len = d.length() || 1e-4;
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.divideScalar(len));
  mesh.scale.set(1, len, 1);
}
function makeArmModel(i) {
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.42, 0.38, 1, 16), sleeveMats[i]);
  const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.26, 1, 16), skinMat);
  const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.4, 16, 12), sleeveMats[i]);
  const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.55, 16, 12), sleeveMats[i]);
  for (const o of [upper, fore, elbow, shoulder]) { o.castShadow = true; scene.add(o); }
  return { upper, fore, elbow, shoulder };
}
// 体（踏み台・胴・頭）
const shirtMat = new THREE.MeshStandardMaterial({ color: '#f4f2ec', roughness: 0.9 });
const stool = new THREE.Mesh(new THREE.CylinderGeometry(1.1, 0.9, 1.9, 20), new THREE.MeshStandardMaterial({ color: '#8a5a32', roughness: 0.8 }));
stool.position.set(0, 0.45, 7.4); stool.castShadow = true; scene.add(stool);
const torso = new THREE.Mesh(new THREE.CapsuleGeometry(1.15, 1.6, 8, 16), shirtMat);
torso.castShadow = true; scene.add(torso);
const head = new THREE.Mesh(new THREE.SphereGeometry(0.85, 20, 16), skinMat);
head.castShadow = true; scene.add(head);
const hat = new THREE.Mesh(new THREE.CylinderGeometry(0.75, 0.6, 0.9, 18), shirtMat);
hat.castShadow = true; scene.add(hat);

// =====================================================================
// 生地（粒子 + 塑性バネ）
// =====================================================================
let parts = [], springs = [];
let kneaded = 0, done = false, startTime = null, endTime = null;
let tension = 0, holdPeak = 0, overT = 0, bothHeld = false;
let failing = null, respawnT = 0, fails = 0, spawning = false;
let airborne = false, lastAction = null, edgeWarn = 0, shake = 0;

function spawnDough(drop) {
  parts = []; springs = [];
  const s = CFG.spacing, RX = CFG.doughRX, RY = CFG.doughRY;
  const pr = s * 0.5, y0 = RY + pr + (drop ? 7 : 0);
  for (let x = -RX; x <= RX + 1e-6; x += s) for (let y = -RY; y <= RY + 1e-6; y += s) for (let z = -RX; z <= RX + 1e-6; z += s) {
    if ((x * x + z * z) / (RX * RX) + (y * y) / (RY * RY) > 1) continue;
    const jx = (Math.random() - .5) * 0.04, jz = (Math.random() - .5) * 0.04;
    const p = new THREE.Vector3(x + jx, y + y0, z + jz);
    parts.push({ p, q: p.clone(), held: null, j: Math.random() });
  }
  for (let i = 0; i < parts.length; i++) for (let j = i + 1; j < parts.length; j++) {
    const d = parts[i].p.distanceTo(parts[j].p);
    const v0 = parts[j].p.clone().sub(parts[i].p); // 元の向き（形を変える時に使う）
    if (d < s * 1.5) springs.push({ a: parts[i], b: parts[j], rest0: d, rest: d, near: true, v0 });
    else if (d < s * 1.9) springs.push({ a: parts[i], b: parts[j], rest0: d, rest: d, near: false, v0 });
  }
  kneaded = 0; done = false; tension = 0; holdPeak = 0; overT = 0;
  elong = 0; flat = 0; stretchV = 0; stretchH = 0; clearBread(); resetBody();
  failing = null; respawnT = 0; airborne = false; lastAction = null;
  spawning = !!drop;
  for (const h of hands) h.holding = null;
  $('done').style.display = 'none';
}
// 形：elong > 0 で横長（両手で上下に動かした）、< 0 で縦長（左右に動かした）、0 付近で丸
let elong = 0, stretchV = 0, stretchH = 0;
let flat = 0; // 平たさ（押さえながらこねるほど薄く広がる）
function applyShape() {
  // 体積はそのまま：薄くなった分だけ横に広がる
  const sx = Math.exp(elong / 2 + flat / 2), sz = Math.exp(-elong / 2 + flat / 2), sy = Math.exp(-flat);
  for (const sp of springs) {
    if (!sp.v0) continue;
    const r0 = Math.hypot(sp.v0.x * sx, sp.v0.y * sy, sp.v0.z * sz);
    sp.rest *= r0 / sp.rest0; // 今の長さも同じ割合で変える → こねている最中に目に見えて伸びる
    sp.rest0 = r0;
  }
}
let shapeT = 0;
function shapeFromMotion(v, h) {
  // 上下ばかり動かす → 横に伸びて細長く（フランスパン）。上下左右に動かす → 打ち消し合って丸く
  stretchV += v; stretchH += h;
  elong = THREE.MathUtils.clamp(elong + CFG.SHAPE_RATE * (v - h), -CFG.SHAPE_MAX, CFG.SHAPE_MAX);
  shapeT += v + h;
  if (shapeT > 0.1) { shapeT = 0; applyShape(); }
}

function resetGame() { fails = 0; startTime = null; endTime = null; for (const g of ghosts) scene.remove(g.m); ghosts = []; spawnDough(false); }

const allow = () => CFG.ALLOW * (1 + CFG.ALLOW_GROW * kneaded / 100);
const TH = () => ({ lo: CFG.GOOD_LO, hi: CFG.GOOD_HI, tear: CFG.TEAR });
let grabSpan = 0;   // 両手でつかんだ瞬間の手の間隔
const strainOf = sp => (sp.a.p.distanceTo(sp.b.p) - sp.rest) / sp.rest;
const centroid = () => { const c = new THREE.Vector3(); for (const p of parts) c.add(p.p); return c.divideScalar(Math.max(1, parts.length)); };
const onBoard = p => Math.abs(p.x) < CFG.BW && Math.abs(p.z) < CFG.BD;

// =====================================================================
// 手 / 入力
// =====================================================================
const hands = [0, 1].map(i => {
  const side = i === 0 ? -1 : 1;
  const pos = new THREE.Vector3(side * 1.1, 1.5, 0);
  return {
    i, side, S: new THREE.Vector3(), Snow: new THREE.Vector3(), fwd: new THREE.Vector3(0, 0, -1),
    elbow: new THREE.Vector3(), wrist: new THREE.Vector3(), d: new THREE.Vector3(),
    pos, prev: pos.clone(), vel: new THREE.Vector3(), hv: new THREE.Vector3(), vy: 0, speed: 0, contact: false,
    dmx: 0, dmz: 0, press: 0, grip: false, holding: null, grabY: 0, close: 0.15, model: makeHandModel(i), arm: makeArmModel(i),
  };
});

const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') resetGame();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

function stick(x, y) {
  const m = Math.hypot(x, y);
  if (m < CFG.deadzone) return [0, 0];
  const n = Math.pow(Math.min(1, (m - CFG.deadzone) / (1 - CFG.deadzone)), CFG.stickCurve);
  return [x / m * n, y / m * n];
}
let curPad = null, padName = '', startPrev = false, aPrev = false;
function readInput() {
  const inp = [{ x: 0, z: 0, rz: 0, grip: 0 }, { x: 0, z: 0, rz: 0, grip: 0 }];
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let pad = null; for (const p of pads) if (p && p.connected) { pad = p; break; }
  curPad = pad; padName = pad ? pad.id : '';
  if (pad) {
    const b = i => pad.buttons[i] ? pad.buttons[i].value : 0;
    [inp[0].x, inp[0].z] = stick(pad.axes[0] || 0, pad.axes[1] || 0);
    [inp[1].x, inp[1].z] = stick(pad.axes[2] || 0, pad.axes[3] || 0);
    inp[0].grip = b(6); inp[1].grip = b(7);   // LT / RT：つかむ（つかむと自動で持ち上がる）
    const st = b(9) > 0.5, a = b(0) > 0.5;
    if ((st && !startPrev) || (a && !aPrev && done)) resetGame();
    startPrev = st; aPrev = a;
  }
  const k = c => keys[c] ? 1 : 0;
  inp[0].x += k('KeyD') - k('KeyA'); inp[0].z += k('KeyS') - k('KeyW');
  inp[1].x += k('ArrowRight') - k('ArrowLeft'); inp[1].z += k('ArrowDown') - k('ArrowUp');
  if (keys.KeyQ) inp[0].grip = 1;
  if (keys.KeyM) inp[1].grip = 1;
  return inp;
}
function rumble(strong, weak, ms) {
  const act = curPad && curPad.vibrationActuator;
  if (act && act.playEffect) act.playEffect('dual-rumble', { duration: ms, strongMagnitude: Math.min(1, strong), weakMagnitude: Math.min(1, weak) }).catch(() => {});
}

// 手の真下の生地の高さ
function surfaceY(x, z, r = 0.7) {
  let top = -Infinity;
  for (const p of parts) if ((p.p.x - x) ** 2 + (p.p.z - z) ** 2 < r * r) top = Math.max(top, p.p.y);
  return top;
}

function grab(h) {
  if (failing || spawning || !parts.length) return false;
  // 手の真下で一番上の粒子
  let best = null;
  for (const p of parts) {
    if (p.held) continue;
    const d2 = (p.p.x - h.pos.x) ** 2 + (p.p.z - h.pos.z) ** 2;
    if (d2 < CFG.grabR ** 2 && p.p.y < h.pos.y + 0.5 && (!best || p.p.y > best.p.y)) best = p;
  }
  if (!best || h.pos.y - best.p.y > 1.6) return false;
  const list = [];
  for (const p of parts) {
    if (p.held) continue;
    if (p.p.distanceTo(best.p) < CFG.grabCluster) {
      p.held = h;
      const o = p.p.clone().sub(best.p).multiplyScalar(0.7);
      o.y -= 0.32; // 手のひらの下にぶら下がる
      list.push({ part: p, o });
    }
  }
  h.holding = list;
  h.pos.y = best.p.y + 0.32; h.vy = 0;
  h.grabY = h.pos.y;
  if (startTime === null) startTime = performance.now();
  rumble(0.45, 0.3, 60);
  return true;
}
function release(h) {
  judgeStretch(h);
  for (const g of h.holding) {
    g.part.held = null;
    // 手の勢いを引き継ぐ（振り回して離すと飛んでいく）
    g.part.q.copy(g.part.p).addScaledVector(h.vel, -1 / 60);
  }
  h.holding = null;
}

// =====================================================================
// 体ごと操作する（10）
//   左スティック ＝ 上半身を傾ける（踏み台の上でバランスを取る）。前に倒すほど手が奥へ・体重が乗る
//   右スティック ＝ 左右：体をひねる（両手が前後逆に動く）／上下：腕を伸ばす・縮める
//   LT / RT      ＝ その手に体重をかけて押さえる（前に傾いているほど強く押せる）
//   体は倒れようとする。手で生地やまな板を押さえていれば支えになるが、
//   その手が滑ったり（勢いよく動かして生地を弾く）、まな板の外だと支えにならず転ぶ
// =====================================================================
let slamT = 0, clock = 0;
function holderCount() { return 0; }
const body = { fz: 0, vz: 0, fx: 0, vx: 0, nz: 0, nx: 0, tw: 0, tv: 0, ext: 0, ev: 0, top: new THREE.Vector3(), right: new THREE.Vector3(), fwd: new THREE.Vector3(), down: false };
function resetBody() { Object.assign(body, { fz: 0, vz: 0, fx: 0, vx: 0, nz: 0, nx: 0, tw: 0, tv: 0, ext: 0, ev: 0, down: false }); }

function updateHands(dt) {
  const inp = readInput();
  clock += dt;
  const B = body, Ls = inp[0], Rs = inp[1];
  // 何か操作するまではゲーム開始前（倒れない）
  if (startTime === null && (Math.hypot(Ls.x, Ls.z) > 0.2 || Math.hypot(Rs.x, Rs.z) > 0.2 || Ls.grip > 0.2 || Rs.grip > 0.2)) startTime = performance.now();
  const onBoardXZ = p => Math.abs(p.x) < CFG.BW && Math.abs(p.z) < CFG.BD;

  // ---- 体：倒れようとする振り子。筋肉（スティック）と、手の支えで踏ん張る ----
  const tz = -THREE.MathUtils.clamp(Ls.z, -1, 1) * CFG.leanFwd;   // 上に倒す＝前へ
  const tx = THREE.MathUtils.clamp(Ls.x, -1, 1) * CFG.leanSide;
  let supZ = 0, supX = 0;
  for (const h of hands) {
    // 手で押さえている間は支えになる（生地の上でも、まな板の上でもOK）。弾いて滑った手は支えにならない
    if (h.press > 0.15 && onBoardXZ(h.pos) && h.pos.y < 2 && h.speed < CFG.hitSpeed) {
      supZ += CFG.support * h.press; supX += CFG.support * h.press * 0.7;
    }
  }
  // 踏み台のぐらつき：ゆっくり向きが変わるランダムな揺れ（読めない）
  B.nz += ((Math.random() - 0.5) * 6 - B.nz * 0.8) * dt * 3;
  B.nx += ((Math.random() - 0.5) * 6 - B.nx * 0.8) * dt * 3;
  if (startTime === null || spawning) {
    // 開始前・新しい生地が降ってくる間は、まっすぐ立っている
    B.fz *= 0.9; B.fx *= 0.9; B.vz = 0; B.vx = 0;
  } else if (!B.down) {
    // 右スティックの動きも体を揺らす：腕を前に伸ばすと前のめりに、ひねると横に振られる
    const armZ = CFG.reachTorque * B.ext + CFG.reachKick * B.ev;
    const armX = CFG.twistTorque * B.tw + CFG.twistKick * B.tv;
    const az = CFG.tipG * Math.sin(B.fz) + CFG.muscle * (tz - B.fz) - supZ * B.fz - CFG.bodyD * B.vz + B.nz * CFG.wobble + armZ;
    const ax = CFG.tipG * Math.sin(B.fx) + CFG.muscle * (tx - B.fx) - supX * B.fx - CFG.bodyD * B.vx + B.nx * CFG.wobble * 0.8 + armX;
    B.vz += az * dt; B.vx += ax * dt;
  } else {
    // 転倒中：そのまま倒れていく
    B.vz += Math.sign(B.fz || 1) * 6 * dt * (Math.abs(B.fz) > Math.abs(B.fx) ? 1 : 0);
    B.vx += Math.sign(B.fx || 1) * 6 * dt * (Math.abs(B.fx) >= Math.abs(B.fz) ? 1 : 0);
  }
  B.fz += B.vz * dt; B.fx += B.vx * dt;
  if (B.down) { B.fz = THREE.MathUtils.clamp(B.fz, -1.4, 1.4); B.fx = THREE.MathUtils.clamp(B.fx, -1.4, 1.4); }
  // 倒れた！
  if (!B.down && !failing && !done && (B.fz > CFG.fallFwd || B.fz < -CFG.fallBack || Math.abs(B.fx) > CFG.fallSide)) {
    B.down = true;
    fail(B.fz > CFG.fallFwd ? '顔から突っ込んだ！' : '踏み台から落ちた！', centroid());
  }
  // ひねり・腕の伸び（関節のバネ）
  const tTw = THREE.MathUtils.clamp(Rs.x, -1, 1) * CFG.twist;
  const tEx = -THREE.MathUtils.clamp(Rs.z, -1, 1);
  B.tv += (CFG.jointK * (tTw - B.tw) - CFG.jointD * B.tv) * dt; B.tw += B.tv * dt;
  B.ev += (CFG.jointK * (tEx - B.ext) - CFG.jointD * B.ev) * dt; B.ext += B.ev * dt;

  // 胴の上端（肩の中心）
  const P0 = CFG.hip;
  B.top.set(P0.x + Math.sin(B.fx) * CFG.torsoLen, P0.y + Math.cos(B.fx) * Math.cos(B.fz) * CFG.torsoLen, P0.z - Math.sin(B.fz) * CFG.torsoLen);
  B.right.set(Math.cos(B.tw), 0, Math.sin(B.tw));     // ひねると右肩が前／後ろへ
  B.fwd.set(Math.sin(B.tw) * 0.0, 0, -1).normalize();

  hands.forEach((h, i) => {
    const n = inp[i];
    // 肩の位置
    h.Snow.copy(B.top).addScaledVector(B.right, h.side * CFG.shoulderHalf);
    // 手の目標：肩から前へ（腕の伸び）。少し内側へ
    const reach = CFG.reach0 + B.ext * CFG.reach1 + Math.sin(B.fz) * CFG.leanReach;
    const target = h.Snow.clone();
    target.x += -h.side * CFG.inward; target.z -= reach; target.y = 0;
    // 体重のかけ方：トリガー × 前傾
    const weight = CFG.pressBase + (1 - CFG.pressBase) * THREE.MathUtils.clamp(B.fz / CFG.leanFwd, 0, 1);
    h.press += (THREE.MathUtils.clamp(n.grip, 0, 1) * weight - h.press) * Math.min(1, dt * 14);

    // ---- 手：腕の先にぶら下がるバネ。急に動かすと行き過ぎて揺れる ----
    h.hv.x += (CFG.handK * (target.x - h.pos.x) - CFG.handD * h.hv.x) * dt;
    h.hv.z += (CFG.handK * (target.z - h.pos.z) - CFG.handD * h.hv.z) * dt;
    h.d.set(h.hv.x * dt, 0, h.hv.z * dt);
    h.pos.x += h.d.x; h.pos.z += h.d.z;
    h.dmx = Math.abs(h.d.x); h.dmz = Math.abs(h.d.z);
    h.speed = Math.hypot(h.hv.x, h.hv.z);
    h.fwd.set(h.pos.x - h.Snow.x, 0, h.pos.z - h.Snow.z).normalize();

    // ---- 高さ：生地の上に乗る。押さえるほどめり込む ----
    const s = surfaceY(h.pos.x, h.pos.z, CFG.contactR);
    h.contact = isFinite(s) && !failing && !spawning;
    const ty = h.contact ? Math.max(0.35, s + 0.42 - h.press * CFG.pressDepth) : (onBoardXZ(h.pos) ? 0.4 + (1 - h.press) * 0.3 : 0.9);
    const w = CFG.handSpring;
    h.vy += (w * w * (ty - h.pos.y) - 2 * 0.8 * w * h.vy) * dt;
    h.pos.y += h.vy * dt;
    if (h.pos.y < 0.3) { h.pos.y = 0.3; h.vy = Math.max(0, h.vy); }
    h.wrist.copy(h.pos).addScaledVector(h.fwd, -CFG.handOffset * 0.9); h.wrist.y = h.pos.y + 0.25;
    // ひじ：肩と手首の間で、外側・上へ少し張り出す
    h.elbow.copy(h.Snow).lerp(h.wrist, 0.5);
    h.elbow.x += h.side * CFG.elbowOut; h.elbow.y += 0.6 + h.press * 0.5;

    const inst = h.pos.clone().sub(h.prev).divideScalar(Math.max(dt, 1e-4));
    h.vel.lerp(inst, Math.min(1, dt * 25));
    h.prev.copy(h.pos);
    h.close = 0.15;
  });
  // こね：押さえながら「体から遠ざける向き」に押し出した時だけ進む（本物のこね方：押し出す→力を抜いて戻す）
  //   押さえたまま手前に引くと、こねは進まず生地が手前に引きずられる（まな板の手前から落ちることも）
  if (!failing) {
    let moveV = 0, moveH = 0, flatten = 0;
    for (const h of hands) if (h.contact && h.speed < CFG.hitSpeed && h.press > 0.15) {
      const rx = h.pos.x - h.Snow.x, rz = h.pos.z - h.Snow.z, rl = Math.hypot(rx, rz) || 1;
      const out = (h.d.x * rx + h.d.z * rz) / rl; // 体から遠ざかる成分
      if (out <= 0) { h.pullT = (h.pullT || 0) + 1 / 60; continue; }
      h.pullT = 0;
      const k = out * h.press;
      moveV += Math.abs(rz / rl) * k; moveH += Math.abs(rx / rl) * k;
      flatten += k;
    }
    if (flatten > 0) flat = Math.min(CFG.FLAT_MAX, flat + flatten * CFG.FLAT_RATE);
    if (moveV + moveH > 0) {
      shapeFromMotion(moveV, moveH);
      addKneaded((moveV + moveH) * CFG.KNEAD_PER_MOVE);
    }
  }
}

// 手と生地の接触（物理の反復の中で呼ぶ）
//   ゆっくり → 手の下の生地が手についていく（ずれずに一緒に動く＝こねる）
//   速い     → 生地を弾く（手の勢いが生地に乗って飛んでいく）
function handPush() {
  const R = CFG.contactR, dt = 1 / 60, it = CFG.iterations;
  let hit = 0;
  for (const h of hands) {
    const fast = Math.max(0, h.speed - CFG.hitSpeed);
    for (const pt of parts) {
      const dx = pt.p.x - h.pos.x, dz = pt.p.z - h.pos.z;
      if (dx > R || dx < -R || dz > R || dz < -R) continue;
      const d = Math.hypot(dx, dz);
      if (d >= R || pt.p.y > h.pos.y + 0.3) continue;
      const wgt = 1 - d / R; // 手のひらの真ん中ほど強く
      if (fast <= 0) {
        // 押さえているほど生地が手についてくる（位置だけずらす＝勢いはつけない）
        const f = (CFG.stickLight + (CFG.stick - CFG.stickLight) * h.press) * wgt / it;
        pt.p.x += h.d.x * f; pt.p.z += h.d.z * f;
        pt.q.x += h.d.x * f; pt.q.z += h.d.z * f;
        // 手のひらで上から押さえる
        if (pt.p.y > h.pos.y - 0.15) pt.p.y = h.pos.y - 0.15;
      } else {
        // 弾く：手の勢いを渡す
        // 押さえていても勢いには勝てない。押さえているほど引っかかって強く飛ぶ
        const k = CFG.hitK * (0.6 + 0.6 * h.press) * Math.min(1, fast / 4) * wgt / it;
        pt.q.x -= h.hv.x * dt * k; pt.q.z -= h.hv.z * dt * k;
        pt.q.y -= Math.min(6, fast) * dt * k * 0.4; // 少し浮き上がる
        hit = Math.max(hit, fast);
      }
    }
  }
  if (hit > 0 && clock - lastHitPop > 0.6) {
    lastHitPop = clock;
    rumble(Math.min(1, 0.3 + hit * 0.15), 0.4, 120);
  }
}
let lastHitPop = -9;

// =====================================================================
// 物理
// =====================================================================
function stepDough(dt) {
  const k = kneaded / 100;
  const stiff = 0.28 + 0.2 * k;
  const yieldS = 0.1 + 0.05 * k;
  const plast = 3 - 2 * k;
  const recov = 0.2 + 0.6 * k;
  const pr = CFG.spacing * 0.5, minD = CFG.spacing * 0.85;
  const g = CFG.gravity * dt * dt;

  // 積分（ベルレ）
  for (const pt of parts) {
    const p = pt.p, q = pt.q;
    if (pt.held) continue;
    const vx = (p.x - q.x) * CFG.damping, vy = (p.y - q.y) * CFG.damping, vz = (p.z - q.z) * CFG.damping;
    q.copy(p);
    p.x += vx; p.y += vy - g; p.z += vz;
  }
  const holders = hands.filter(h => h.holding);
  // 着地前の下向き速度（叩きつけの判定用）
  let impactSum = 0, impactN = 0, impactMax = 0;
  for (const pt of parts) {
    if (pt.held || !onBoard(pt.p) || pt.p.y >= pr) continue;
    const vy = (pt.q.y - pt.p.y) / dt;
    if (vy > 0) { impactSum += vy; impactN++; impactMax = Math.max(impactMax, vy); }
  }

  for (let it = 0; it < CFG.iterations; it++) {
    for (const h of holders) for (const gg of h.holding) gg.part.p.copy(h.pos).add(gg.o);
    for (const sp of springs) {
      const a = sp.a.p, b = sp.b.p;
      const dx = b.x - a.x, dy = b.y - a.y, dz = b.z - a.z;
      const d = Math.hypot(dx, dy, dz) || 1e-5;
      const wa = sp.a.held ? 0 : 1, wb = sp.b.held ? 0 : 1, ws = wa + wb;
      if (!ws) continue;
      const f = (d - sp.rest) / d * (sp.near ? stiff : stiff * 0.5);
      a.x += dx * f * wa / ws; a.y += dy * f * wa / ws; a.z += dz * f * wa / ws;
      b.x -= dx * f * wb / ws; b.y -= dy * f * wb / ws; b.z -= dz * f * wb / ws;
    }
    if (it === 0 || it === CFG.iterations - 1) {
      for (let i = 0; i < parts.length; i++) {
        const A = parts[i], a = A.p;
        for (let j = i + 1; j < parts.length; j++) {
          const B = parts[j], b = B.p;
          const dx = b.x - a.x; if (dx > minD || dx < -minD) continue;
          const dy = b.y - a.y; if (dy > minD || dy < -minD) continue;
          const dz = b.z - a.z; if (dz > minD || dz < -minD) continue;
          const d = Math.hypot(dx, dy, dz) || 1e-5;
          if (d >= minD) continue;
          const wa = A.held ? 0 : 1, wb = B.held ? 0 : 1, ws = wa + wb;
          if (!ws) continue;
          const f = (d - minD) / d * 0.5;
          a.x += dx * f * wa / ws; a.y += dy * f * wa / ws; a.z += dz * f * wa / ws;
          b.x -= dx * f * wb / ws; b.y -= dy * f * wb / ws; b.z -= dz * f * wb / ws;
        }
      }
    }
    handPush();
    // 床（まな板の上だけ。外は作業台まで落ちる）
    for (const pt of parts) {
      if (pt.held) continue;
      const floor = onBoard(pt.p) ? pr : -0.5 + pr;
      if (pt.p.y < floor) pt.p.y = floor;
    }
  }
  // 摩擦
  for (const pt of parts) {
    if (pt.held) continue;
    const floor = onBoard(pt.p) ? pr : -0.5 + pr;
    if (pt.p.y <= floor + 0.01) {
      pt.q.x += (pt.p.x - pt.q.x) * CFG.groundFric;
      pt.q.z += (pt.p.z - pt.q.z) * CFG.groundFric;
      if (pt.q.y < pt.p.y) pt.q.y = pt.p.y; // 跳ねない
    }
  }

  // ---- 叩きつけ ----
  let minY = Infinity;
  for (const pt of parts) if (!pt.held) minY = Math.min(minY, pt.p.y);
  if (minY > pr + 0.7) airborne = true;
  if (impactN >= 3) {
    const impact = impactSum / impactN;
    if (spawning) {
      spawning = false; airborne = false;
      puff(centroid(), 30, 1); rumble(0.4, 0.3, 110);
    } else if (airborne && impact > 3) {
      airborne = false; // 08 は叩きつけなし（落ちた時に粉が舞うだけ）
      puff(centroid().setY(0.1), 12, 0.8);
    }
  }

  // ---- 張り・ちぎれ（両手で広げた距離で決まる） ----
  bothHeld = holders.length === 2;
  let tv = 0;
  if (bothHeld && grabSpan) {
    const [L, R] = hands;
    tv = Math.max(0, Math.hypot(R.pos.x - L.pos.x, R.pos.z - L.pos.z) - grabSpan) / allow();
  }
  tension += (tv - tension) * Math.min(1, dt * 15);
  if (bothHeld) holdPeak = Math.max(holdPeak, tension);
  if (!failing) {
    if (bothHeld && tension > TH().tear) {
      overT += dt;
      if (overT >= CFG.TEAR_HOLD) tear();
    } else overT = Math.max(0, overT - dt * 2);
  }

  // ---- 塑性変形 → じわじわこねた度 ----
  let flow = 0;
  const pl = Math.min(1, plast * dt);
  for (const sp of springs) {
    const len = sp.a.p.distanceTo(sp.b.p);
    const strain = (len - sp.rest) / sp.rest;
    if (Math.abs(strain) > yieldS) {
      const target = len - Math.sign(strain) * yieldS * sp.rest;
      const boost = 1 + CFG.FLOW_BOOST * Math.max(0, Math.abs(strain) - yieldS * 2);
      const d = (target - sp.rest) * Math.min(1, pl * boost);
      sp.rest += d;
      flow += Math.abs(d) / sp.rest0 * (sp.near ? 1 : 0.5);
    }
    sp.rest += (sp.rest0 - sp.rest) * Math.min(1, recov * dt);
    sp.rest = THREE.MathUtils.clamp(sp.rest, sp.rest0 * 0.5, sp.rest0 * 3);
  }
  const move = holders.reduce((s, h) => s + h.vel.length(), 0);
  if (!failing) addKneaded(flow * CFG.GAIN * Math.min(1, move / 3) * (1 + k));

  // ---- まな板から落ちる ----
  if (!failing && !spawning) {
    let out = 0, held = holders.length > 0;
    for (const pt of parts) if (!onBoard(pt.p)) out++;
    const frac = out / parts.length;
    edgeWarn = Math.min(1, frac / CFG.FALL_FRAC);
    if (!held && frac >= CFG.FALL_FRAC && minY < 0) fail('落ちた！');
  }
}

function addKneaded(v) {
  if (done || failing) return;
  kneaded = Math.min(100, kneaded + v);
  if (kneaded >= 100) {
    done = true; endTime = performance.now();
    for (const h of hands) if (h.holding) release(h);
    rumble(1, 1, 400);
    bakeT = 0.01; // 少し待ってから焼き上がり
    $('done').style.display = 'none';
  }
}

function award(kind, base) {
  addKneaded(base);
  return { v: base, rep: false };
}

function judgeStretch(h) {
  if (!bothHeld && holdPeak === 0) return;
  const th = TH();
  if (!failing && holdPeak >= th.lo) {
    const edge = holdPeak >= th.hi;
    const r = award('stretch', edge ? CFG.BONUS_EDGE : CFG.BONUS_GOOD);
    popup(h.pos.clone().setY(h.pos.y + 0.8), (edge ? 'ギリギリ！' : 'いい伸び！') + (r.rep ? '（交互に！）' : ''), edge ? '#ffd36a' : '#bdf08a', edge);
    rumble(edge ? 0.7 : 0.45, edge ? 0.6 : 0.5, edge ? 160 : 110);
    puff(h.pos.clone().setY(0.6), edge ? 16 : 9, 0.8);
  }
  holdPeak = 0;
}

function tear() {
  // 一番伸びたバネの位置で、その向きに垂直な面をまたぐバネを全部切る
  let worst = null, ws = 0;
  for (const sp of springs) { const s = strainOf(sp); if (s > ws) { ws = s; worst = sp; } }
  if (!worst) return;
  const m = worst.a.p.clone().add(worst.b.p).multiplyScalar(0.5);
  const nrm = worst.b.p.clone().sub(worst.a.p).normalize();
  springs = springs.filter(sp => sp.a.p.clone().sub(m).dot(nrm) * sp.b.p.clone().sub(m).dot(nrm) >= 0);
  // 切れた反動で飛び散りすぎないよう勢いを殺す
  for (const pt of parts) pt.q.lerp(pt.p, 0.75);
  puff(m, 20, 1.2);
  fail('ちぎれた！', m);
}

function fail(reason, at) {
  if (failing || done) return;
  failing = { reason, t: 0 };
  fails++;
  for (const h of hands) if (h.holding) { for (const g of h.holding) g.part.held = null; h.holding = null; }
  holdPeak = 0; overT = 0;
  popup((at || centroid()).clone().setY(2.4), reason, '#ff7a5c', true);
  rumble(1, 0.9, 300);
}
function updateFail(dt) {
  if (!failing) return;
  failing.t += dt;
  if (failing.t >= CFG.FAIL_SHOW && parts.length) {
    // 消えていく（小さくなりながら）
    const col = doughMat.color.clone();
    for (let i = 0; i < parts.length; i += 2) {
      const m = new THREE.Mesh(ghostGeo, ghostMat.clone());
      m.material.color.copy(col);
      m.position.copy(parts[i].p); m.scale.setScalar(CFG.spacing * 0.9);
      scene.add(m); ghosts.push({ m, t: 0 });
    }
    parts = []; springs = [];
    respawnT = 0.3;
  }
}

// =====================================================================
// 演出
// =====================================================================
const PN = 400;
const pPos = new Float32Array(PN * 3).fill(-100), pVel = new Float32Array(PN * 3), pLife = new Float32Array(PN);
const pGeo = new THREE.BufferGeometry(); pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({ color: '#fffaf0', size: 0.1, transparent: true, opacity: 0.85, depthWrite: false })));
let pNext = 0;
function puff(at, n, power) {
  for (let i = 0; i < n; i++) {
    const j = pNext; pNext = (pNext + 1) % PN;
    const a = Math.random() * Math.PI * 2, sp = (1 + Math.random() * 3) * power;
    pPos[j * 3] = at.x + Math.cos(a) * 0.8; pPos[j * 3 + 1] = Math.max(0.05, at.y); pPos[j * 3 + 2] = at.z + Math.sin(a) * 0.8;
    pVel[j * 3] = Math.cos(a) * sp; pVel[j * 3 + 1] = 1 + Math.random() * 2.5 * power; pVel[j * 3 + 2] = Math.sin(a) * sp;
    pLife[j] = 0.5 + Math.random() * 0.7;
  }
}
const tmpV = new THREE.Vector3();
function popup(at, text, col, big) {
  tmpV.copy(at).project(camera);
  const el = document.createElement('div');
  el.className = 'pop'; el.textContent = text;
  el.style.left = ((tmpV.x + 1) / 2 * innerWidth) + 'px';
  el.style.top = ((1 - tmpV.y) / 2 * innerHeight) + 'px';
  el.style.color = col; el.style.fontSize = (big ? 30 : 22) + 'px';
  $('pops').appendChild(el);
  setTimeout(() => el.remove(), 1150);
}
function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

// =====================================================================
// 描画同期
// =====================================================================
const CREAM0 = new THREE.Color('#dcc49a'), CREAM1 = new THREE.Color('#fbeed4'), WARN = new THREE.Color('#ff3a1a');
function syncDough(t) {
  mc.reset();
  if (!parts.length) { mc.update(); return; }
  const c = centroid();
  mc.position.set(c.x, MC_S - 1.2, c.z);
  const inv = 1 / (2 * MC_S);
  for (const pt of parts) {
    const bx = (pt.p.x - mc.position.x) * inv + 0.5, by = (pt.p.y - mc.position.y) * inv + 0.5, bz = (pt.p.z - mc.position.z) * inv + 0.5;
    if (bx < 0.02 || bx > 0.98 || by < 0.02 || by > 0.98 || bz < 0.02 || bz > 0.98) continue;
    mc.addBall(bx, by, bz, BALL_STRENGTH * (0.9 + pt.j * 0.2), BALL_SUB);
  }
  mc.update();
  const k = kneaded / 100;
  doughMat.color.copy(CREAM0).lerp(CREAM1, k);
  doughMat.roughness = 0.88 - k * 0.45;
  // 張り具合で赤く光る（ちぎれそう）
  const th = TH();
  const danger = THREE.MathUtils.clamp((tension - th.hi) / (th.tear - th.hi), 0, 1);
  const blink = overT > 0 ? 0.5 + 0.5 * Math.sin(t * 40) : 1;
  doughMat.emissive.copy(WARN).multiplyScalar(danger * 0.35 * blink + (overT > 0 ? 0.25 : 0));
}
function syncHands() {
  // 体
  const B = body;
  const mid = CFG.hip.clone().lerp(B.top, 0.5);
  torso.position.copy(mid);
  torso.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), B.top.clone().sub(CFG.hip).normalize());
  const up = B.top.clone().sub(CFG.hip).normalize();
  head.position.copy(B.top).addScaledVector(up, 1.1);
  hat.position.copy(head.position).addScaledVector(up, 0.85);
  hat.quaternion.copy(torso.quaternion);
  hands.forEach(h => {
    const m = h.model;
    m.root.position.copy(h.pos);
    const c = h.close;
    m.fingers.forEach((f, j) => { f.rotation.x = -0.1 + c * 1.25; f.rotation.y = (j - 1.5) * 0.1 * (1 - c); });
    m.thumbPv.rotation.y = 0.4 - c * 0.7; m.thumbPv.rotation.z = c * 0.6;
    m.root.rotation.order = 'YXZ';
    const dir = h.pos.clone().sub(h.wrist); dir.y = 0;
    m.root.rotation.y = dir.lengthSq() > 1e-4 ? Math.atan2(-dir.x, -dir.z) : 0;
    m.root.rotation.x = -0.1 - h.press * 0.25;
    m.ring.position.set(h.pos.x, 0.02, h.pos.z);
    const hit = h.speed > CFG.hitSpeed;
    m.ring.material.opacity = hit ? 0.9 : 0.3 + h.press * 0.5;
    m.ring.material.color.set(hit ? '#ff5a3c' : (h.side < 0 ? '#7fb6ff' : '#ff9a8a'));
    const a = h.arm;
    a.shoulder.position.copy(h.Snow);
    a.elbow.position.copy(h.elbow);
    cylBetween(a.upper, h.Snow, h.elbow);
    cylBetween(a.fore, h.elbow, h.wrist);
  });
}
function updateFx(dt) {
  for (let j = 0; j < PN; j++) {
    if (pLife[j] <= 0) continue;
    pLife[j] -= dt; pVel[j * 3 + 1] -= 8 * dt;
    for (let k = 0; k < 3; k++) pPos[j * 3 + k] += pVel[j * 3 + k] * dt;
    if (pPos[j * 3 + 1] < 0.03) { pPos[j * 3 + 1] = 0.03; pVel[j * 3] *= 0.5; pVel[j * 3 + 2] *= 0.5; pVel[j * 3 + 1] = 0; }
    if (pLife[j] <= 0) pPos[j * 3 + 1] = -100;
  }
  pGeo.attributes.position.needsUpdate = true;
  for (const g of ghosts) {
    g.t += dt; g.m.position.y -= dt * (0.5 + g.t * 6);
    g.m.scale.setScalar(Math.max(0.001, CFG.spacing * 0.9 * (1 - g.t * 1.6)));
    g.m.material.opacity = Math.max(0, 1 - g.t * 1.6);
  }
  ghosts = ghosts.filter(g => { if (g.t > 0.65) { scene.remove(g.m); g.m.material.dispose(); return false; } return true; });
  shake *= Math.exp(-dt * 10);
  edgeLine.material.opacity = edgeWarn > 0.15 && !failing ? (0.4 + 0.4 * Math.sin(performance.now() / 70)) * edgeWarn : 0;
}

function hud(now) {
  $('kval').firstChild.nodeValue = Math.floor(kneaded) + ' ';
  $('barFill').style.width = kneaded + '%';
  $('stage').textContent = stageOf(kneaded).name;
  const tip = $('tip');
  tip.className = failing || overT > 0 ? 'warn' : '';
  tip.textContent = failing ? '失敗… 新しい生地が来るよ'
    : overT > 0 ? 'ちぎれる！ ゆるめて！'
    : spawning ? '新しい生地…'
    : hands.some(h => h.press > 0.3 && h.contact && (h.pullT || 0) > 0.25) ? '押さえたまま引くと生地が引きずられる！ 戻す時は力を抜いて'
    : '押さえて奥へ押し出す → 力を抜いて戻す。右スティックでも体が揺れる！';
  const t = startTime === null ? 0 : (done ? endTime : now) - startTime;
  $('stat').textContent = (fails ? '失敗 ' + fails + '　' : '') + '⏱ ' + fmtTime(t);
  // 張りメーター
  const th = TH(), max = th.tear * 1.2, pct = v => Math.min(100, v / max * 100) + '%';
  const g = $('gauge');
  g.style.opacity = hands.some(h => h.holding) ? 1 : 0;
  g.className = overT > 0 ? 'danger' : '';
  const zg = $('zGood'), ze = $('zEdge'), zt = $('zTear');
  zg.style.left = pct(th.lo); zg.style.width = `calc(${pct(th.hi)} - ${pct(th.lo)})`;
  ze.style.left = pct(th.hi); ze.style.width = `calc(${pct(th.tear)} - ${pct(th.hi)})`;
  zt.style.left = pct(th.tear); zt.style.right = '0';
  $('gNeedle').style.left = pct(tension);
  $('gPeak').style.left = pct(holdPeak);
  // 形メーター（左＝丸い、右＝細長い）
  $('shapeDot').style.left = (Math.min(1, Math.abs(elong) / CFG.SHAPE_MAX) * 100) + '%';
  $('shapeDir').textContent = Math.abs(elong) < 0.15 ? '' : elong > 0 ? '（よこ長）' : '（たて長）';
  // バランス表示（上＝前のめり）
  const bx = THREE.MathUtils.clamp(body.fx / CFG.fallSide, -1.2, 1.2), bz = THREE.MathUtils.clamp(body.fz > 0 ? body.fz / CFG.fallFwd : body.fz / CFG.fallBack, -1.2, 1.2);
  $('balDot').style.left = (50 + bx * 50) + '%';
  $('balDot').style.top = (50 - bz * 50) + '%';
  $('bal').className = Math.hypot(bx, bz) > 0.75 ? 'danger' : '';
  $('help').textContent =
    (padName ? '🎮 ' + padName.slice(0, 34) : '🎮 未接続（ボタンを押すと認識）') + '\n' +
    '左スティック：上半身を傾ける（踏み台の上でバランス）　右スティック：左右でひねる・上下で腕を伸ばす\n' +
    'LT/RT：その手に体重をかけて押さえる（前に傾くほど強い・押さえている手は支えになる）　速く動かすと生地が飛ぶ／傾きすぎると転ぶ　／　キーボード：WASD 傾き・矢印 ひねり/腕・Q/M 押さえる・R';
}

// =====================================================================
// ループ
// =====================================================================
function resize() {
  const w = Math.max(1, innerWidth), hh = Math.max(1, innerHeight);
  renderer.setSize(w, hh);
  camera.aspect = w / hh; camera.updateProjectionMatrix();
  const k = Math.max(1, 1.55 / camera.aspect);
  camBase.set(0, 11 * k, 8.8 * k);
}
addEventListener('resize', resize);
resize();
resetGame();
window.G = { get parts() { return parts; }, hands, CFG, get tension() { return tension; }, get kneaded() { return kneaded; }, get fails() { return fails; }, get failing() { return failing; } };

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (renderer.domElement.width !== Math.round(innerWidth * renderer.getPixelRatio())) resize();
  updateHands(dt);
  if (parts.length) stepDough(1 / 60);
  updateFail(dt);
  if (respawnT > 0) { respawnT -= dt; if (respawnT <= 0) { respawnT = 0; spawnDough(true); } }
  updateFx(dt);
  updateBake(dt);
  syncDough(now / 1000);
  syncHands();
  camera.position.copy(camBase);
  if (shake > 0.01) camera.position.add(new THREE.Vector3((Math.random() - .5) * shake, (Math.random() - .5) * shake, 0));
  camera.lookAt(0, 0, 0.8);
  hud(now);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
</body>
