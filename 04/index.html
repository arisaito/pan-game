<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>04 壁打ち生地 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #efe9df; }
  canvas { display: block; }
  body { font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    font-weight: bold; font-size: 22px; line-height: 1.3;
    color: #fff8ec; text-shadow: 0 2px 4px rgba(60,35,15,.7); text-align: center;
    pointer-events: none; white-space: nowrap;
  }
  #dots { font-size: 18px; letter-spacing: 4px; margin-top: 4px; }
  #sub { font-size: 14px; font-weight: normal; opacity: .9; }
  #hint {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    font-size: 14px; line-height: 1.5; color: #fff8ec; width: 92%;
    text-shadow: 0 1px 3px rgba(60,35,15,.8); text-align: center; pointer-events: none;
  }
  #result {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(40,25,12,.6); backdrop-filter: blur(3px);
  }
  #result.show { display: flex; animation: fade .4s ease-out; }
  @keyframes fade { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  #card {
    background: #fff8ec; color: #4a3220; border-radius: 22px; padding: 22px 30px 20px;
    width: min(440px, 88vw); text-align: center; box-shadow: 0 16px 50px rgba(0,0,0,.5);
  }
  #rTag { display: inline-block; padding: 4px 16px; border-radius: 999px; font-weight: bold;
    font-size: 15px; color: #fff; letter-spacing: 2px; background: #e0962f; }
  #rTitle { font-size: 30px; font-weight: bold; margin: 8px 0 2px; }
  #rComment { font-size: 15px; color: #7a5a40; margin-bottom: 6px; }
  #bread { display: block; margin: 4px auto; }
  #rItems { font-size: 15px; color: #6a4a30; line-height: 1.7; }
  #rRetry { margin-top: 12px; font-size: 13px; color: #9a7a5a; }
</style>
</head>
<body>
<div id="hud"><div id="hudText"></div><div id="dots"></div><div id="sub"></div></div>
<div id="hint"></div>
<div id="result"><div id="card">
  <div id="rTag">成功</div>
  <div id="rTitle"></div>
  <div id="rComment"></div>
  <canvas id="bread" width="300" height="170"></canvas>
  <div id="rItems"></div>
  <div id="rRetry">Aボタン / Rキー / クリック でもう一度</div>
</div></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';

const $ = id => document.getElementById(id);

// ---- 調整用パラメータ ----
const GOAL = 10;              // 落とさず連続キャッチする回数
const R = 0.42;               // 生地の半径
const WALL_Z = -7.5;          // 壁の位置（手前の手は z=0 付近）
const SIDE_X = 4.6;           // 左右の壁
const HAND_X = 3.4;           // 手が動ける範囲（左右）
const HAND_Y0 = 0.5, HAND_Y1 = 3.3; // 手が動ける範囲（上下）
const HAND_SPEED = 6.5;       // 手の移動速度（スティック全開）
const HAND_HOME_X = 1.2;      // 左右の手の初期位置
const HAND_CROSS = 0.9;       // 手が反対側に入り込める量
const THROW_SPEED = 10;       // 投げる速さ（奥向き）
const RETURN_SPEED0 = 7.5;    // 跳ね返りの速さ（最初）
const RETURN_SPEED_UP = 0.5;  // キャッチするごとに速くなる（7.5 → 9回目で12）
const SPREAD0 = 0.7;          // 跳ね返りが手の位置からズレる量（最初）
const SPREAD_UP = 0.22;       // キャッチするごとにズレが大きくなる
const MIN_OFFSET = 1.0;       // 跳ね返り先は手から最低これだけズレる（手を動かさないと取れない）
const AWAY_MIN = 1.6;         // 跳ね返り先は前に投げた位置から最低これだけ離れる（左右に振られる）
const AWAY_UP = 0.08;         // キャッチするごとに離れ具合が大きくなる
const GRAVITY = 7;
const CATCH_R = 0.85;         // 手と生地がこの距離以内でトリガーを握っていればキャッチ
const SHOW_GUIDE = true;      // 戻ってくる生地の位置を手前の面に薄く表示
const STICK_DEAD = 0.15;

// ---- three.js ----
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);

const HAZE = new THREE.Color('#f3eee6');
const scene = new THREE.Scene();
scene.background = HAZE.clone();
scene.fog = new THREE.Fog(HAZE, 5, 20);  // 遠くは白く霞む
const camera = new THREE.PerspectiveCamera(55, 1, 0.05, 100);

scene.add(new THREE.HemisphereLight('#fff6e8', '#7a5a3a', 1.0));
const sun = new THREE.DirectionalLight('#fff1dc', 1.4);
sun.position.set(2, 12, 2);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -7, right: 7, top: 6, bottom: -16, near: 1, far: 30 });
sun.target.position.set(0, 0, -5);
scene.add(sun, sun.target);

function canvasTex(w, h, draw, repeat) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8;
  if (repeat) { t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(...repeat); }
  return t;
}
// タイル壁
const tileTex = canvasTex(256, 256, (b, w, h) => {
  b.fillStyle = '#e9e2d4'; b.fillRect(0, 0, w, h);
  b.fillStyle = '#f7f2e8';
  for (let y = 0; y < 2; y++) for (let x = 0; x < 2; x++) b.fillRect(x * 128 + 4, y * 128 + 4, 120, 120);
}, [1, 1]);
const wallTex = tileTex.clone(); wallTex.repeat.set(10, 7); wallTex.needsUpdate = true;
const sideTex = tileTex.clone(); sideTex.repeat.set(16, 7); sideTex.needsUpdate = true;
const wall = new THREE.Mesh(new THREE.PlaneGeometry(SIDE_X * 2, 7), new THREE.MeshStandardMaterial({ map: wallTex, roughness: 0.6 }));
wall.position.set(0, 3.5, WALL_Z); wall.receiveShadow = true;
scene.add(wall);
for (const s of [-1, 1]) {
  const sw = new THREE.Mesh(new THREE.PlaneGeometry(18, 7), new THREE.MeshStandardMaterial({ map: sideTex, roughness: 0.6 }));
  sw.rotation.y = -s * Math.PI / 2; sw.position.set(s * SIDE_X, 3.5, WALL_Z + 9); sw.receiveShadow = true;
  scene.add(sw);
}
// 床（作業台）
const floorTex = canvasTex(512, 512, (b, w, h) => {
  b.fillStyle = '#c8955c'; b.fillRect(0, 0, w, h);
  for (let i = 0; i < 60; i++) {
    b.strokeStyle = `rgba(110,65,25,${0.08 + Math.random() * 0.12})`; b.lineWidth = 1 + Math.random() * 2;
    const y0 = Math.random() * h; b.beginPath();
    for (let x = 0; x <= w; x += 8) { const y = y0 + Math.sin(x * 0.02 + i) * 4; x ? b.lineTo(x, y) : b.moveTo(x, y); }
    b.stroke();
  }
}, [3, 4]);
const floor = new THREE.Mesh(new THREE.PlaneGeometry(SIDE_X * 2, 18), new THREE.MeshStandardMaterial({ map: floorTex, roughness: 0.85 }));
floor.rotation.x = -Math.PI / 2; floor.position.set(0, 0, WALL_Z + 9); floor.receiveShadow = true;
scene.add(floor);

// ---- 生地 ----
const doughGeo = new THREE.IcosahedronGeometry(R, 5);
const basePos = doughGeo.attributes.position.array.slice();
const doughMat = new THREE.MeshStandardMaterial({ color: '#f3e2bd', roughness: 0.8 });
const dough = new THREE.Mesh(doughGeo, doughMat);
dough.castShadow = true;
scene.add(dough);
let waves = [];
function shapeDough(smooth) {
  if (!waves.length) waves = Array.from({ length: 9 }, () => ({ k: new THREE.Vector3().randomDirection().multiplyScalar((2 + Math.random() * 5) / R), p: Math.random() * 7, a: 0.5 + Math.random() * 0.5 }));
  const pos = doughGeo.attributes.position.array;
  const amp = 0.14 * (1 - smooth) + 0.012;
  for (let i = 0; i < pos.length; i += 3) {
    const x = basePos[i], y = basePos[i + 1], z = basePos[i + 2];
    let n = 0;
    for (const w of waves) n += Math.sin(x * w.k.x + y * w.k.y + z * w.k.z + w.p) * w.a;
    const s = 1 + n / 4 * amp;
    pos[i] = x * s; pos[i + 1] = y * s; pos[i + 2] = z * s;
  }
  doughGeo.attributes.position.needsUpdate = true;
  doughGeo.computeVertexNormals();
  doughMat.roughness = 0.9 - smooth * 0.45;
}
const CREAM_ROUGH = new THREE.Color('#e3c993'); // こねる前（近く）
const CREAM_SMOOTH = new THREE.Color('#f6dfae'); // こねた後（近く）

// ---- 手（手のひらを壁に向けて構える） ----
const skin = new THREE.MeshStandardMaterial({ color: '#f1c49c', roughness: 0.65 });
const sleeveMat = new THREE.MeshStandardMaterial({ color: '#f4f2ec', roughness: 0.9 });
// 右手を作り、左手は x を反転して作る
function makeHand(side) {
  const root = new THREE.Group();
  const hand = new THREE.Group();
  hand.scale.x = side; // side = 1:右手 / -1:左手（鏡像）
  root.add(hand);
  const palm = new THREE.Mesh(new THREE.SphereGeometry(0.34, 24, 16), skin);
  palm.scale.set(1, 1.05, 0.42);
  hand.add(palm);
  const fingers = [];
  for (let i = 0; i < 4; i++) {
    const pivot = new THREE.Group();
    pivot.position.set(-0.21 + i * 0.14, 0.3, 0);
    const len = [0.22, 0.28, 0.27, 0.2][i];
    const f = new THREE.Mesh(new THREE.CapsuleGeometry(0.062, len, 6, 10), skin);
    f.position.y = len / 2 + 0.03;
    pivot.add(f); hand.add(pivot); fingers.push(pivot);
  }
  const thumbPivot = new THREE.Group();
  thumbPivot.position.set(-0.3, 0.02, 0.02);
  const thumb = new THREE.Mesh(new THREE.CapsuleGeometry(0.07, 0.2, 6, 10), skin);
  thumb.position.set(-0.08, 0.1, 0); thumb.rotation.z = 0.7;
  thumbPivot.add(thumb); hand.add(thumbPivot);
  const arm = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 1.6, 14), skin);
  const armDir = new THREE.Vector3(0.62, -0.72, 0.32).normalize(); // 外側下手前へ（視界の真ん中をふさがない）
  const wrist = new THREE.Vector3(0.05, -0.28, 0.02);
  arm.position.copy(wrist).addScaledVector(armDir, 0.8); arm.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), armDir);
  hand.add(arm);
  const sleeve = new THREE.Mesh(new THREE.CylinderGeometry(0.27, 0.3, 2.4, 14), sleeveMat);
  sleeve.position.copy(wrist).addScaledVector(armDir, 2.75); sleeve.quaternion.copy(arm.quaternion);
  hand.add(sleeve);
  hand.traverse(o => { if (o.isMesh) o.castShadow = true; });
  scene.add(root);
  return { root, hand, fingers, thumbPivot };
}
const handModels = [makeHand(-1), makeHand(1)]; // [左, 右]

// 戻ってくる生地の位置ガイド（手前の面に投影）
const guide = new THREE.Mesh(new THREE.RingGeometry(R * 0.9, R * 1.05, 40),
  new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0, depthWrite: false, fog: false }));
scene.add(guide);

// 粉パーティクル
const PN = 300;
const pPos = new Float32Array(PN * 3).fill(-100), pVel = new Float32Array(PN * 3), pLife = new Float32Array(PN);
const pGeo = new THREE.BufferGeometry();
pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
scene.add(new THREE.Points(pGeo, new THREE.PointsMaterial({ color: '#ffffff', size: 0.06, transparent: true, opacity: 0.9, depthWrite: false })));
let pNext = 0;
function puff(p, n, power, normal) {
  for (let i = 0; i < n; i++) {
    const j = pNext; pNext = (pNext + 1) % PN;
    const v = new THREE.Vector3().randomDirection().multiplyScalar((0.5 + Math.random() * 2) * power);
    if (normal) v.addScaledVector(normal, power * 1.5);
    pPos.set([p.x, p.y, p.z], j * 3); pVel.set([v.x, v.y, v.z], j * 3);
    pLife[j] = 0.5 + Math.random() * 0.6;
  }
}

// ---- 状態 ----
// state: 'ready'（手の上にある）/ 'held'（握ってる）/ 'fly'（壁へ）/ 'return'（戻ってくる）/ 'drop'（落ちた）/ 'done'
const d = { pos: new THREE.Vector3(), vel: new THREE.Vector3(), state: 'ready', sq: 0, sqv: 0, sqAxis: new THREE.Vector3(0, 0, 1), spin: new THREE.Vector3() };
// hands[0] = 左手, hands[1] = 右手
const hands = [-1, 1].map((side, i) => ({
  side, model: handModels[i],
  pos: new THREE.Vector3(), prev: new THREE.Vector3(), vel: new THREE.Vector3(),
  grip: false, wasGrip: false, close: 0,
}));
let holder = 1; // 生地を持っている／乗せている手
let streak, best, drops, dropT, resultShown, shake, returnTarget;
const lastPt = new THREE.Vector3();

function handHome(hd) { return new THREE.Vector3(hd.side * HAND_HOME_X, 1.6, 0); }
function reset() {
  streak = 0; best = 0; drops = 0; resultShown = false; shake = 0;
  for (const hd of hands) { hd.pos.copy(handHome(hd)); hd.prev.copy(hd.pos); hd.vel.set(0, 0, 0); }
  newDough();
  $('result').classList.remove('show');
}
function newDough() {
  d.state = 'ready'; d.vel.set(0, 0, 0); d.sq = 0; d.sqv = 0;
  holder = 1;
  d.pos.copy(hands[holder].pos).add(new THREE.Vector3(0, 0.05, -0.55));
  shapeDough(0);
}

// ---- 入力 ----
let mode = 'mouse', padSeen = false, lastA = false;
const mouse = { ndc: new THREE.Vector2(), has: false, down: false };
const keys = new Set();
const ray = new THREE.Raycaster();
const handPlane = new THREE.Plane(new THREE.Vector3(0, 0, 1), 0);
addEventListener('pointermove', e => { mouse.ndc.set(e.clientX / innerWidth * 2 - 1, -(e.clientY / innerHeight) * 2 + 1); mouse.has = true; mode = 'mouse'; });
renderer.domElement.addEventListener('pointerdown', () => { mouse.down = true; mode = 'mouse'; });
addEventListener('pointerup', () => { mouse.down = false; });
addEventListener('keydown', e => {
  if (e.key === 'r' || e.key === 'R') { reset(); return; }
  keys.add(e.code);
  if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'KeyW', 'KeyA', 'KeyS', 'KeyD', 'KeyK', 'KeyQ', 'KeyE', 'Space'].includes(e.code)) { mode = 'key'; e.preventDefault(); }
});
addEventListener('keyup', e => keys.delete(e.code));
$('result').addEventListener('click', () => { if (resultShown) reset(); });

function readInput() {
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  for (const p of pads) {
    if (!p) continue;
    padSeen = true;
    const btn = i => p.buttons[i] ? (p.buttons[i].value || (p.buttons[i].pressed ? 1 : 0)) : 0;
    const a = btn(0) > 0.5;
    if (a && !lastA && resultShown) reset();
    lastA = a;
    // 左スティック＋LT(LB)＝左手、右スティック＋RT(RB)＝右手
    const stick = (ax, ay) => {
      let x = p.axes[ax] || 0, y = p.axes[ay] || 0;
      if (Math.hypot(x, y) < STICK_DEAD) x = y = 0;
      return { type: 'vel', x, y: -y };
    };
    const L = { ...stick(0, 1), grip: Math.max(btn(6), btn(4)) > 0.35 };
    const Rt = { ...stick(2, 3), grip: Math.max(btn(7), btn(5)) > 0.35 };
    if (L.x || L.y || Rt.x || Rt.y || L.grip || Rt.grip) mode = 'pad';
    if (mode === 'pad') return [L, Rt];
  }
  if (mode === 'key') {
    // 左手：WASD + Q ／ 右手：矢印 + スペース(K)
    const dir = (l, r, u, dn) => {
      let x = 0, y = 0;
      if (keys.has(l)) x -= 1; if (keys.has(r)) x += 1;
      if (keys.has(u)) y += 1; if (keys.has(dn)) y -= 1;
      const m = Math.hypot(x, y) || 1;
      return { type: 'vel', x: x / m, y: y / m };
    };
    return [
      { ...dir('KeyA', 'KeyD', 'KeyW', 'KeyS'), grip: keys.has('KeyQ') || keys.has('KeyE') },
      { ...dir('ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'), grip: keys.has('Space') || keys.has('KeyK') },
    ];
  }
  // マウスは右手のみ（左手は定位置）
  const rh = hands[1];
  let tx = rh.pos.x, ty = rh.pos.y;
  if (mouse.has) {
    ray.setFromCamera(mouse.ndc, camera);
    const hit = new THREE.Vector3();
    if (ray.ray.intersectPlane(handPlane, hit)) { tx = hit.x; ty = hit.y; }
  }
  return [{ type: 'vel', x: 0, y: 0, grip: false }, { type: 'pos', x: tx, y: ty, grip: mouse.down }];
}

// ---- 更新 ----
function update(dt, inps) {
  // 両手
  hands.forEach((hd, i) => {
    const inp = inps[i];
    if (inp.type === 'vel') {
      hd.pos.x += inp.x * HAND_SPEED * dt;
      hd.pos.y += inp.y * HAND_SPEED * dt;
    } else {
      const k = 1 - Math.exp(-dt * 22);
      hd.pos.x += (inp.x - hd.pos.x) * k;
      hd.pos.y += (inp.y - hd.pos.y) * k;
    }
    // 左手は左寄り、右手は右寄り（真ん中は少し重なる）
    const lo = hd.side < 0 ? -HAND_X : -HAND_CROSS, hi = hd.side < 0 ? HAND_CROSS : HAND_X;
    hd.pos.x = THREE.MathUtils.clamp(hd.pos.x, lo, hi);
    hd.pos.y = THREE.MathUtils.clamp(hd.pos.y, HAND_Y0, HAND_Y1);
    const inst = hd.pos.clone().sub(hd.prev).divideScalar(Math.max(dt, 1e-4));
    hd.vel.lerp(inst, 1 - Math.exp(-dt * 20));
    hd.prev.copy(hd.pos);
    hd.wasGrip = hd.grip;
    hd.grip = inp.grip && !resultShown;
  });
  // 両手が重ならないように少し押し合う
  const gap = hands[1].pos.x - hands[0].pos.x;
  if (gap < 0.75 && Math.abs(hands[1].pos.y - hands[0].pos.y) < 0.8) {
    const push = (0.75 - gap) / 2;
    hands[0].pos.x -= push; hands[1].pos.x += push;
  }

  const hh = hands[holder];
  const handFront = new THREE.Vector3(hh.pos.x, hh.pos.y + 0.05, hh.pos.z - 0.5);

  switch (d.state) {
    case 'ready':
      d.pos.lerp(handFront, 1 - Math.exp(-dt * 25));
      if (hh.grip && !hh.wasGrip) d.state = 'held';
      else {
        // 生地が乗っていない方の手で握っても持てる（持ち替え）
        const o = hands[1 - holder];
        if (o.grip && !o.wasGrip) { holder = 1 - holder; d.state = 'held'; }
      }
      break;
    case 'held':
      d.pos.lerp(handFront, 1 - Math.exp(-dt * 30));
      if (!hh.grip) throwDough();
      break;
    case 'fly':
    case 'return':
    case 'drop':
      d.vel.y -= GRAVITY * dt;
      const prevZ = d.pos.z;
      d.pos.addScaledVector(d.vel, dt);
      // 壁
      if (d.state === 'fly' && d.pos.z - R < WALL_Z) {
        d.pos.z = WALL_Z + R;
        bounceOffWall();
      }
      // 左右の壁・天井
      if (Math.abs(d.pos.x) > SIDE_X - R) { d.pos.x = Math.sign(d.pos.x) * (SIDE_X - R); d.vel.x *= -0.6; }
      if (d.pos.y > 6.5) { d.pos.y = 6.5; d.vel.y = -Math.abs(d.vel.y) * 0.5; }
      // キャッチ判定：手前の面を通過するあたりで、手の近くにあってトリガーを握っていれば
      if (d.state === 'return' && d.pos.z > -1.0 && d.pos.z < 0.6) {
        // 握っている手のうち、近い方でキャッチ
        let bestI = -1, bestD = CATCH_R;
        hands.forEach((hd, i) => {
          const dist = Math.hypot(d.pos.x - hd.pos.x, d.pos.y - hd.pos.y);
          if (hd.grip && dist < bestD) { bestD = dist; bestI = i; }
        });
        if (bestI >= 0) { holder = bestI; catchDough(); }
      }
      if (d.state === 'return' && d.pos.z > 1.2) miss();
      // 床
      if (d.pos.y < R) {
        const impact = -d.vel.y;
        d.pos.y = R;
        d.vel.y = impact > 2 ? impact * 0.3 : 0;
        d.vel.x *= 0.7; d.vel.z *= 0.7;
        if (impact > 2) { squash(new THREE.Vector3(0, 1, 0), Math.min(0.5, impact / 14)); puff(new THREE.Vector3(d.pos.x, 0.05, d.pos.z), 20, 0.8); }
        if (d.state !== 'drop') miss();
      }
      if (d.state === 'drop') { dropT += dt; if (dropT > 1.1) newDough(); }
      break;
    case 'done':
      d.pos.lerp(handFront, 1 - Math.exp(-dt * 10));
      break;
  }

  // つぶれのバネ
  d.sqv += (-260 * d.sq - 12 * d.sqv) * dt;
  d.sq += d.sqv * dt;
  d.sq = THREE.MathUtils.clamp(d.sq, -0.4, 0.6);
  if (d.state === 'fly' || d.state === 'return' || d.state === 'drop') {
    dough.rotation.x += d.spin.x * dt; dough.rotation.y += d.spin.y * dt;
  }

  // 粉
  for (let j = 0; j < PN; j++) {
    if (pLife[j] <= 0) continue;
    pLife[j] -= dt; pVel[j * 3 + 1] -= 4 * dt;
    for (let k = 0; k < 3; k++) pPos[j * 3 + k] += pVel[j * 3 + k] * dt;
    if (pLife[j] <= 0) pPos[j * 3 + 1] = -100;
  }
  pGeo.attributes.position.needsUpdate = true;
  shake *= Math.exp(-dt * 10);
}

function throwDough() {
  d.state = 'fly';
  // 基本はまっすぐ奥へ。手を振っていた方向に少し流れる
  const hv = hands[holder].vel;
  lastPt.copy(hands[holder].pos); // 投げた位置（＝前にキャッチした位置）を覚えておく
  d.vel.set(hv.x * 0.3, 1.6 + hv.y * 0.25, -THROW_SPEED);
  d.spin.set((Math.random() - .5) * 6, (Math.random() - .5) * 6, 0);
  rumble(0.3, 60);
}

function bounceOffWall() {
  d.state = 'return';
  squash(new THREE.Vector3(0, 0, 1), 0.5);
  puff(d.pos.clone().add(new THREE.Vector3(0, 0, 0.1)), 25, 0.9, new THREE.Vector3(0, 0, 1));
  rumble(0.15, 50);
  // 戻ってくる先：
  //  ・左右どちらかの手の位置から、最低 MIN_OFFSET はズレた所（毎回少しは手を動かす必要がある）
  //  ・前に投げた（キャッチした）位置から AWAY_MIN 以上離れた所（左右に振られる）
  //  ・キャッチするほどズレの上限が大きく、戻りが速く
  const spread = Math.max(MIN_OFFSET + 0.4, SPREAD0 + streak * SPREAD_UP);
  const away = AWAY_MIN + streak * AWAY_UP;
  let tx = 0, ty = 0, bestScore = -1;
  for (let i = 0; i < 40; i++) {
    const base = hands[Math.random() < 0.5 ? 0 : 1].pos;
    const ang = Math.random() * Math.PI * 2, rr = MIN_OFFSET + Math.random() * (spread - MIN_OFFSET);
    const x = THREE.MathUtils.clamp(base.x + Math.cos(ang) * rr, -HAND_X + 0.3, HAND_X - 0.3);
    const y = THREE.MathUtils.clamp(base.y + Math.sin(ang) * rr * 0.75, HAND_Y0 + 0.3, HAND_Y1 - 0.2);
    const fromLast = Math.hypot(x - lastPt.x, y - lastPt.y);
    const fromHand = Math.min(...hands.map(hd => Math.hypot(x - hd.pos.x, y - hd.pos.y)));
    // 条件を満たせば即採用。満たさなければ一番条件に近いものを残す
    if (fromLast >= away && fromHand >= MIN_OFFSET * 0.8) { tx = x; ty = y; break; }
    const score = Math.min(fromLast / away, fromHand / MIN_OFFSET);
    if (score > bestScore) { bestScore = score; tx = x; ty = y; }
  }
  returnTarget = new THREE.Vector3(tx, ty, -0.3);
  const vz = RETURN_SPEED0 + streak * RETURN_SPEED_UP;
  const t = (returnTarget.z - d.pos.z) / vz;
  d.vel.set((tx - d.pos.x) / t, (ty - d.pos.y + 0.5 * GRAVITY * t * t) / t, vz);
}

function catchDough() {
  d.state = 'held';
  streak++;
  best = Math.max(best, streak);
  squash(new THREE.Vector3(0, 0, 1), 0.35);
  puff(d.pos, 18, 0.7);
  shake = 0.05;
  rumble(0.5, 90);
  shapeDough(streak / GOAL);
  if (streak >= GOAL) {
    d.state = 'done';
    setTimeout(showResult, 900);
  }
}

function miss() {
  d.state = 'drop'; dropT = 0;
  if (streak > 0) drops++;
  else drops++;
  streak = 0;
  shapeDough(0);
  rumble(0.8, 250);
}

function squash(axis, amt) { d.sqAxis.copy(axis); d.sq = amt; d.sqv = 0; }

function rumble(strong, ms) {
  if (!navigator.getGamepads) return;
  for (const pad of navigator.getGamepads()) {
    if (pad && pad.vibrationActuator) pad.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: Math.min(1, strong * 0.7) }).catch(() => {});
  }
}

// ---- 描画同期 ----
const tmpQ = new THREE.Quaternion();
function sync(t) {
  dough.position.copy(d.pos);
  // つぶれ：軸方向に縮み、他の2軸に広がる
  const a = 1 - d.sq, b = 1 + d.sq * 0.6;
  const ax = d.sqAxis;
  dough.scale.set(Math.abs(ax.x) > 0.5 ? a : b, Math.abs(ax.y) > 0.5 ? a : b, Math.abs(ax.z) > 0.5 ? a : b);

  // 距離で色が変わる：近いとクリーム色、遠いほど白く霞む
  const far = THREE.MathUtils.clamp(-d.pos.z / -WALL_Z, 0, 1);
  const base = CREAM_ROUGH.clone().lerp(CREAM_SMOOTH, streak / GOAL);
  doughMat.color.copy(base).lerp(new THREE.Color('#ffffff'), Math.pow(far, 0.8) * 0.85);
  doughMat.emissive.copy(HAZE).multiplyScalar(Math.pow(far, 0.9) * 0.45);

  hands.forEach((hd, i) => {
    const holding = d.state === 'held' && holder === i;
    hd.close += ((hd.grip || holding ? 1 : 0) - hd.close) * 0.33;
    const m = hd.model, c = hd.close;
    m.root.position.copy(hd.pos);
    m.fingers.forEach((f, j) => { f.rotation.x = -c * 1.3; f.rotation.z = (j - 1.5) * 0.1 * (1 - c); });
    m.thumbPivot.rotation.y = -c * 0.9;
    m.root.rotation.z = -hd.vel.x * 0.02;
  });

  // ガイド
  if (SHOW_GUIDE && d.state === 'return') {
    const k = THREE.MathUtils.clamp(1 - (-d.pos.z) / -WALL_Z, 0, 1);
    guide.position.set(d.pos.x, d.pos.y, -0.3);
    guide.material.opacity = 0.15 + k * 0.5;
    const near = hands.some(hd => Math.hypot(d.pos.x - hd.pos.x, d.pos.y - hd.pos.y) < CATCH_R);
    guide.material.color.set(near ? '#ffe46a' : '#ffffff');
    guide.scale.setScalar(1 + (1 - k) * 0.6);
  } else guide.material.opacity = 0;

  camera.position.set(0, 1.85, 4.3);
  if (shake > 0.005) camera.position.add(new THREE.Vector3((Math.random() - .5) * shake, (Math.random() - .5) * shake, 0));
  camera.lookAt(0, 1.6, -6);
}

// ---- HUD / 結果 ----
function hud() {
  $('hudText').textContent = d.state === 'done' ? '🍞 生地 完成！' : `連続キャッチ ${streak} / ${GOAL}`;
  $('dots').textContent = '●'.repeat(streak) + '○'.repeat(GOAL - streak);
  $('sub').textContent = drops ? `最高 ${best}回　落とした ${drops}回` : '';
  const how = mode === 'pad'
    ? '左スティック＋LT：左手　右スティック＋RT：右手　握る → 離すと壁へ投げる'
    : mode === 'key'
    ? '左手：WASD＋Q　右手：矢印＋スペース　握る → 離すと壁へ投げる'
    : 'マウス：右手を動かす　クリック長押し：握る → 離すと壁へ投げる（両手はパッドかキーボードで）';
  $('hint').innerHTML = how + '<br>跳ね返ってきた生地を、近い方の手で握ってキャッチ！ 落とすと0回から'
    + (mode !== 'pad' && !padSeen ? '（パッドはボタンを一度押すと認識）' : '');
}

function showResult() {
  resultShown = true;
  const perfect = drops === 0;
  $('rTitle').textContent = perfect ? 'ノーミスで完成！' : '生地 完成！';
  $('rComment').textContent = perfect ? '一度も落とさなかった。職人の手さばき！' : 'ふっくらなめらかな生地になった！';
  $('rItems').textContent = `落とした回数 ${drops}回`;
  const cv = $('bread'), b = cv.getContext('2d');
  b.clearRect(0, 0, cv.width, cv.height);
  const cx = 150, cy = 105, w = 115, hh = 66;
  b.fillStyle = '#e8dccb'; b.beginPath(); b.ellipse(cx, cy + hh * 0.55, 140, 22, 0, 0, 7); b.fill();
  const g = b.createLinearGradient(0, cy - hh, 0, cy + hh * 0.5);
  g.addColorStop(0, '#c8792b'); g.addColorStop(1, '#e2a04f');
  b.fillStyle = g; b.beginPath();
  b.moveTo(cx - w, cy + hh * 0.45);
  b.bezierCurveTo(cx - w * 1.05, cy - hh * 0.9, cx + w * 1.05, cy - hh * 0.9, cx + w, cy + hh * 0.45);
  b.closePath(); b.fill();
  b.strokeStyle = 'rgba(255,230,170,.8)'; b.lineWidth = 5; b.lineCap = 'round';
  for (let i = -1; i <= 1; i++) {
    b.beginPath(); b.moveTo(cx + i * w * 0.45 - 14, cy - hh * 0.25);
    b.quadraticCurveTo(cx + i * w * 0.45, cy - hh * 0.45, cx + i * w * 0.45 + 14, cy - hh * 0.2); b.stroke();
  }
  $('result').classList.add('show');
}

function resize() {
  renderer.setSize(Math.max(1, innerWidth), Math.max(1, innerHeight));
  camera.aspect = Math.max(1, innerWidth) / Math.max(1, innerHeight);
  camera.fov = camera.aspect < 1 ? 70 : 55;
  camera.updateProjectionMatrix();
}
addEventListener('resize', resize);
resize();
reset();

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.033, (now - last) / 1000);
  last = now;
  if (renderer.domElement.width !== Math.round(innerWidth * renderer.getPixelRatio())) resize();
  update(dt, readInput());
  sync(now / 1000);
  hud();
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
