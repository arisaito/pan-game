<script type="module">
import * as THREE from 'three';
import { MarchingCubes } from 'three/addons/objects/MarchingCubes.js';

const $ = id => document.getElementById(id);

// =====================================================================
// 15：肩とひじを別々に動かして、めん棒を転がす
//   手はめん棒の両端を握っている（13と同じ）
//   左右スティック上下 ＝ その側の肩を前へ乗り出す／後ろへ引く（乗り出すと肩が下がる）
//   左右スティック左右 ＝ その腕を左右へ振る
//   LT / RT ＝ その腕のひじを伸ばす（離すとひじが曲がって手が上がる）。ひじを伸ばすほど手が下がって、めん棒を押しつける
//   ふつうの「めん棒を前へ転がす」を、肩とひじに分けて自分で組み立てる：
//     前へ転がす ＝ 肩を乗り出しながら、ひじを少し曲げていく（そうしないと押しつけすぎる）
//     手前へ戻す ＝ 肩を引きながら、ひじを伸ばしていく（そうしないとめん棒が浮いて空振り）
//   失敗：勢いよく下ろす → 叩きつけて穴があく ／ 押しつけすぎ → 破れる
//         左右で押す強さがちがう → 片側だけ薄くなって破れる ／ 同じ向きばかり → 細長く裂ける
// =====================================================================
const CFG = {
  // めん棒
  pinLen: 7.0, pinR: 0.34, gripHalf: 2.9,
  // 腕
  shoulderX: 2.4, shoulderY: 5.4, shoulderZ: 4.2,
  leanFwd: 2.6, leanDrop: 1.1,  // スティック上（乗り出す）で肩が前へ・下へ動く量
  leanBack: 1.4, leanRise: 0.5, // スティック下（引く）で肩が後ろへ・上へ動く量
  upperLen: 3.4, foreLen: 2.3,
  upperPitch: 0.9,              // 上腕の向き（水平から下向き）
  yawOut: 0.12, yawRange: 0.7,  // 腕の左右の向き
  elbowBent: 1.25,              // トリガーを離したときのひじの曲がり（前腕が上を向いて手が上がる）
  elbowStraight: 0.0,           // トリガーを奥まで押したとき（腕がまっすぐ伸びて手が下がる）
  jointK: 45, jointD: 8,        // 肩のバネ（少し遅れて、勢いで行き過ぎる）
  elbowK: 90, elbowD: 12,       // ひじのバネ（すばやい。トリガーを一気に引くと勢いよく下りる）
  armK: 0.25, armKy: 0.05,      // 手が腕の位置へ戻る強さ（前後左右／上下。上下はやわらかく、生地に押し返されると浮く）
  handDamp: 0.85,
  support: 1.0,                 // 生地がめん棒を押し返す強さ
  goodSink: 0.35,               // めん棒が生地の厚さのこの割合めり込むと「押す強さ 1」（よくのびる）
  overSink: 0.65, overHold: 0.3,  // めん棒が生地の厚さのこの割合以上めり込んだままだと破れる // 押す強さがこれを超えたままだと破れる
  slamSpeed: 3.0,                 // めん棒がこの速さ以上で生地に当たると、叩きつけて穴があく
  // 生地
  spacing: 0.42, RX: 1.7, RY: 1.05, RZ: 1.7,
  gravity: 26, damping: 0.985, iterations: 8,
  stiff: 0.5, yieldS: 0.2, plast: 2, recov: 0,
  fric: 0.85, pinGrip: 0.15,
  rollRate: 0.022,              // 押しながら転がした距離あたりの伸び
  elongTear: 2.6,
  lopGain: 3, lopDecay: 0.03, lopTear: 0.12, // めん棒が傾いたまま転がした分のかたより
  tiltOk: 0.45,                 // これくらいの傾きなら大丈夫
  R0: 1.7,
  TEAR: 1.15, TEAR_HOLD: 0.3,
  BW: 5.5, BD: 3.8,
  targetR: 2.5,
  FALL_FRAC: 0.5,
  FAIL_SHOW: 0.8, deadzone: 0.1, stickCurve: 0.9,
};
const TARGET = new THREE.Vector3(0, 0, 0);

// =====================================================================
// three.js
// =====================================================================
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(2, devicePixelRatio));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.prepend(renderer.domElement);
const scene = new THREE.Scene();
scene.background = new THREE.Color('#2a1d13');
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 200);
scene.add(new THREE.HemisphereLight('#fff4e0', '#5a3a20', 0.9));
const sun = new THREE.DirectionalLight('#fff1dc', 1.5);
sun.position.set(-3, 16, 6); sun.castShadow = true; sun.shadow.mapSize.set(2048, 2048);
Object.assign(sun.shadow.camera, { left: -11, right: 11, top: 9, bottom: -9, near: 1, far: 40 });
scene.add(sun);

function woodTexture(w, h, base, seed0) {
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  const b = c.getContext('2d');
  b.fillStyle = base; b.fillRect(0, 0, w, h);
  let seed = seed0; const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
  for (let i = 0; i < 80; i++) {
    const y0 = rnd() * h, amp = 2 + rnd() * 8, freq = 0.003 + rnd() * 0.008, ph = rnd() * 6;
    b.strokeStyle = `rgba(${110 + rnd() * 40 | 0},${65 + rnd() * 30 | 0},25,${0.06 + rnd() * 0.14})`;
    b.lineWidth = 1 + rnd() * 3; b.beginPath();
    for (let x = 0; x <= w; x += 8) { const y = y0 + Math.sin(x * freq + ph) * amp; x ? b.lineTo(x, y) : b.moveTo(x, y); }
    b.stroke();
  }
  for (let i = 0; i < 2000; i++) { b.fillStyle = `rgba(255,252,240,${rnd() * 0.22})`; b.beginPath(); b.arc(rnd() * w, rnd() * h, rnd() * 2.2, 0, 7); b.fill(); }
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace; t.anisotropy = 8; return t;
}
const counter = new THREE.Mesh(new THREE.BoxGeometry(60, 1, 40), new THREE.MeshStandardMaterial({ map: woodTexture(1024, 1024, '#5b3f29', 3), roughness: 0.9 }));
counter.position.y = -1.0; counter.receiveShadow = true; scene.add(counter);
const boardMat = new THREE.MeshStandardMaterial({ map: woodTexture(1600, 1000, '#d9ab72', 7), roughness: 0.75 });
const sideMat = new THREE.MeshStandardMaterial({ color: '#b98650', roughness: 0.8 });
const boardMesh = new THREE.Mesh(new THREE.BoxGeometry(CFG.BW * 2, 0.5, CFG.BD * 2), [sideMat, sideMat, boardMat, sideMat, sideMat, sideMat]);
boardMesh.position.y = -0.25; boardMesh.receiveShadow = true; scene.add(boardMesh);
// 目標の円
const ring = new THREE.Mesh(new THREE.RingGeometry(CFG.targetR - 0.06, CFG.targetR + 0.06, 96),
  new THREE.MeshBasicMaterial({ color: '#ffffff', transparent: true, opacity: 0.6, depthWrite: false }));
ring.rotation.x = -Math.PI / 2; ring.position.y = 0.015; ring.visible = false; // 目標の輪は表示しない
const sizeRing = new THREE.Mesh(new THREE.RingGeometry(0.97, 1.0, 96),
  new THREE.MeshBasicMaterial({ color: '#ffd24a', transparent: true, opacity: 0.85, depthWrite: false }));
sizeRing.position.y = 0.02; scene.add(sizeRing);

// 生地の見た目
const MC_S = 6.2, MC_RES = 52;
const doughMat = new THREE.MeshStandardMaterial({ color: '#ecd9b2', roughness: 0.8 });
const mc = new MarchingCubes(MC_RES, doughMat, false, false, 120000);
mc.scale.set(MC_S, MC_S, MC_S); mc.castShadow = true; mc.receiveShadow = true; mc.isolation = 80;
scene.add(mc);
const BALL = 0.055, SUB = 12;

// めん棒と手
const pinGroup = new THREE.Group();
const pinWood = new THREE.MeshStandardMaterial({ color: '#c9925a', roughness: 0.55 });
const pinBody = new THREE.Mesh(new THREE.CylinderGeometry(CFG.pinR, CFG.pinR, CFG.pinLen - 1.6, 24), pinWood);
pinBody.rotation.z = Math.PI / 2; pinGroup.add(pinBody);
for (const s of [-1, 1]) {
  const hdl = new THREE.Mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.8, 14), pinWood);
  hdl.rotation.z = Math.PI / 2; hdl.position.x = s * (CFG.pinLen / 2 - 0.4); pinGroup.add(hdl);
}
// 転がっているのが分かる線
const stripe = new THREE.Mesh(new THREE.BoxGeometry(CFG.pinLen - 1.7, 0.04, 0.06), new THREE.MeshStandardMaterial({ color: '#8a5a30' }));
stripe.position.y = CFG.pinR; const roller = new THREE.Group(); roller.add(pinBody.clone()); roller.add(stripe);
pinGroup.remove(pinBody); pinGroup.add(roller);
roller.children[0].rotation.z = Math.PI / 2;
pinGroup.traverse(o => { if (o.isMesh) o.castShadow = true; });
scene.add(pinGroup);
const skinMat = new THREE.MeshStandardMaterial({ color: '#f1c49c', roughness: 0.65 });
const sleeveMats = [new THREE.MeshStandardMaterial({ color: '#4a8fd8', roughness: 0.8 }), new THREE.MeshStandardMaterial({ color: '#d8604f', roughness: 0.8 })];
// 腕：肩・上腕（袖）・ひじ・前腕（ぶら下がり）・手（めん棒を握る）
function cylBetween(mesh, a, b) {
  const d = b.clone().sub(a); const len = d.length() || 1e-4;
  mesh.position.copy(a).addScaledVector(d, 0.5);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), d.divideScalar(len));
  mesh.scale.set(1, len, 1);
}
function makeArm(i) {
  const shoulder = new THREE.Mesh(new THREE.SphereGeometry(0.5, 16, 12), sleeveMats[i]);
  const upper = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.36, 1, 16), sleeveMats[i]);
  const elbow = new THREE.Mesh(new THREE.SphereGeometry(0.36, 16, 12), sleeveMats[i]);
  const fore = new THREE.Mesh(new THREE.CylinderGeometry(0.28, 0.24, 1, 16), skinMat);
  const fist = new THREE.Mesh(new THREE.SphereGeometry(0.4, 18, 14), skinMat); fist.scale.set(1.1, 0.9, 1);
  for (const o of [shoulder, upper, elbow, fore, fist]) { o.castShadow = true; scene.add(o); }
  return { shoulder, upper, elbow, fore, fist };
}
const armMeshes = [makeArm(0), makeArm(1)];

// =====================================================================
// 生地
// =====================================================================
let parts = [], springs = [];
let pinTouch = 0, shapeT = 0, lop = 0, shake = 0, wasTouching = false, lastHit = 0;
let tension = 0, overT = 0, cover = 0, round = 0, failing = null, respawnT = 0, fails = 0, done = false;
let startTime = null, endTime = null, spawning = false, edgeWarn = 0;
function spawnDough(drop) {
  parts = []; springs = [];
  const s = CFG.spacing, { RX, RY, RZ } = CFG, pr = s * 0.5, y0 = RY + pr + (drop ? 6 : 0);
  for (let x = -RX; x <= RX + 1e-6; x += s) for (let y = -RY; y <= RY + 1e-6; y += s) for (let z = -RZ; z <= RZ + 1e-6; z += s) {
    if ((x * x) / (RX * RX) + (y * y) / (RY * RY) + (z * z) / (RZ * RZ) > 1) continue;
    const p = new THREE.Vector3(TARGET.x + x + (Math.random() - .5) * 0.04, y0 + y, TARGET.z + z + (Math.random() - .5) * 0.04);
    parts.push({ p, q: p.clone() });
  }
  for (let i = 0; i < parts.length; i++) for (let j = i + 1; j < parts.length; j++) {
    const d = parts[i].p.distanceTo(parts[j].p);
    const v0 = parts[j].p.clone().sub(parts[i].p);
    if (d < s * 1.5) springs.push({ a: parts[i], b: parts[j], rest0: d, rest: d, near: true, v0 });
    else if (d < s * 1.9) springs.push({ a: parts[i], b: parts[j], rest0: d, rest: d, near: false, v0 });
  }
  shapeM = { a: 1, b: 0, c: 1 }; thin = 1;
  lop = 0;
  tension = 0; overT = 0; failing = null; respawnT = 0; spawning = !!drop; done = false;
  $('done').style.display = 'none';
}
// 生地の形：水平の伸び（2×2 の対称行列）。厚さは体積が変わらないように 1/面積倍
//   めん棒を押しながら転がすと、転がした向きに伸びて薄くなる（どの向きから転がしたかで形が決まる）
let shapeM = { a: 1, b: 0, c: 1 }, thin = 1;
function rollShape(ux, uz, amt) {
  // M ← (I + amt·u uᵀ) · M
  const e00 = 1 + amt * ux * ux, e01 = amt * ux * uz, e11 = 1 + amt * uz * uz;
  const { a, b, c } = shapeM;
  const na = e00 * a + e01 * b, nb = e00 * b + e01 * c, nb2 = e01 * a + e11 * b, nc = e01 * b + e11 * c;
  shapeM = { a: na, b: (nb + nb2) / 2, c: nc };
  thin = shapeM.a * shapeM.c - shapeM.b * shapeM.b; // 面積の倍率＝薄さ
}
// 生地の大きさと細長さ（形の行列の固有値）
// 今の生地の厚さ（のばすほど薄い）
const doughThick = () => 2 * CFG.RY * 0.9 / Math.max(1, thin);
function shapeInfo() {
  const { a, b, c } = shapeM, tr = (a + c) / 2, disc = Math.sqrt(((a - c) / 2) ** 2 + b * b);
  const l1 = tr + disc, l2 = Math.max(1e-3, tr - disc);
  return { l1, l2, theta: 0.5 * Math.atan2(2 * b, a - c), size: CFG.R0 * Math.sqrt(l1 * l2), elong: l1 / l2 };
}
function applyShape() {
  const { a, b, c } = shapeM, sy = 1 / Math.max(1e-3, a * c - b * b);
  for (const sp of springs) {
    const v = sp.v0;
    const r0 = Math.hypot(a * v.x + b * v.z, sy * v.y, b * v.x + c * v.z);
    sp.rest *= r0 / sp.rest0; sp.rest0 = r0;
  }
}

function resetGame() { fails = 0; startTime = null; endTime = null; spawnDough(false); resetPin(); }
const centroid = () => { const c = new THREE.Vector3(); for (const p of parts) c.add(p.p); return c.divideScalar(Math.max(1, parts.length)); };
const onBoard = p => Math.abs(p.x) < CFG.BW && Math.abs(p.z) < CFG.BD;

// =====================================================================
// 入力・めん棒
// =====================================================================
const keys = {};
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') resetGame();
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });
function stick(x, y) {
  const m = Math.hypot(x, y);
  if (m < CFG.deadzone) return [0, 0];
  const n = Math.pow(Math.min(1, (m - CFG.deadzone) / (1 - CFG.deadzone)), CFG.stickCurve);
  return [x / m * n, y / m * n];
}
let curPad = null, padName = '', startPrev = false, aPrev = false;
function readInput() {
  const inp = [{ x: 0, z: 0, grip: 0 }, { x: 0, z: 0, grip: 0 }];
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let pad = null; for (const p of pads) if (p && p.connected) { pad = p; break; }
  curPad = pad; padName = pad ? pad.id : '';
  if (pad) {
    const b = i => pad.buttons[i] ? pad.buttons[i].value : 0;
    [inp[0].x, inp[0].z] = stick(pad.axes[0] || 0, pad.axes[1] || 0);
    [inp[1].x, inp[1].z] = stick(pad.axes[2] || 0, pad.axes[3] || 0);
    inp[0].grip = b(6); inp[1].grip = b(7);
    const st = b(9) > 0.5, a = b(0) > 0.5;
    if ((st && !startPrev) || (a && !aPrev && done)) resetGame();
    startPrev = st; aPrev = a;
  }
  const k = c => keys[c] ? 1 : 0;
  inp[0].x += k('KeyD') - k('KeyA'); inp[0].z += k('KeyS') - k('KeyW');
  inp[1].x += k('ArrowRight') - k('ArrowLeft'); inp[1].z += k('ArrowDown') - k('ArrowUp');
  if (keys.KeyQ) inp[0].grip = 1;
  if (keys.KeyM) inp[1].grip = 1;
  return inp;
}
function rumble(strong, weak, ms) {
  const act = curPad && curPad.vibrationActuator;
  if (act && act.playEffect) act.playEffect('dual-rumble', { duration: ms, strongMagnitude: Math.min(1, strong), weakMagnitude: Math.min(1, weak) }).catch(() => {});
}

// 腕：肩（スティック）とひじ（トリガー）を別々に動かす。手はめん棒の両端を握っている
const hands = [0, 1].map(i => {
  const side = i ? 1 : -1;
  const S = new THREE.Vector3(side * CFG.shoulderX, CFG.shoulderY, CFG.shoulderZ);
  const p = new THREE.Vector3(side * CFG.gripHalf, 3, 0.5);
  return { i, side, S, Snow: S.clone(), lean: 0, lv: 0, yaw: side * CFG.yawOut, yv: 0, bend: CFG.elbowBent, bv: 0,
    elbow: new THREE.Vector3(), target: new THREE.Vector3(), p, q: p.clone(), pos: p, press: 0, pe: 0, overT: 0, raw: 0 };
});
const pin = { a: new THREE.Vector3(), b: new THREE.Vector3(), prevMid: new THREE.Vector3(), vel: new THREE.Vector3(), roll: 0, axis: new THREE.Vector3(1, 0, 0) };
function resetPin() {
  for (const h of hands) { h.lean = 0; h.lv = 0; h.yaw = h.side * CFG.yawOut; h.yv = 0; h.bend = CFG.elbowBent; h.bv = 0; h.overT = 0; armFK(h); h.p.copy(h.target); h.q.copy(h.p); }
  pin.init = false;

// 腕の形から、手が行こうとする位置を計算する

  const touching = pinTouch > 0.02 || avgPe() > 0.05, avgP = (hands[0].press + hands[1].press) / 2;
  const over = hands.some(h => (h.sink || 0) > CFG.overSink * 0.8 && h.cont > 0.002);
  tip.className = failing || over || lop / CFG.lopTear > 0.6 ? 'warn' : '';
  tip.textContent = failing ? '失敗… 新しい生地が来るよ'
    : over ? '押しつけすぎ！ ひじを曲げて（トリガーをゆるめて）'
    : lop / CFG.lopTear > 0.6 ? 'めん棒が傾いてる！ 片側だけ薄くなってる'
    : (si.elong - 1) / (CFG.elongTear - 1) > 0.75 ? '細長くなりすぎ！ 向きを変えて転がそう'
    : !touching ? 'めん棒が浮いてる：ひじを伸ばす（LT/RT）か、肩を乗り出して下げる'
    : avgP < 0.3 ? '軽く触れているだけ：もう少し押しつけて転がそう'
    : '前へ転がす＝肩を乗り出しながらひじを曲げる／戻す＝肩を引きながらひじを伸ばす';
  const t = startTime === null ? 0 : (done ? endTime : now) - startTime;
  $('stat').textContent = (fails ? '失敗 ' + fails + '　' : '') + '⏱ ' + fmtTime(t);
  // 細長さメーター（右の赤まで行くと裂ける）
  const de = (si.elong - 1) / (CFG.elongTear - 1);
  $('gNeedle').style.left = Math.min(100, de * 85) + '%';
  $('gauge').className = de > 0.75 ? 'danger' : '';
  // 押す強さ（押しつけすぎると赤）
  hands.forEach((h, i) => {
    const el = $(i ? 'pressR' : 'pressL').querySelector('div');
    el.style.height = (Math.min(1.5, h.press) / 1.5 * 130) + 'px';
    el.style.background = (h.sink || 0) > CFG.overSink * 0.8 && h.cont > 0.002 ? '#ff4a2a' : 'linear-gradient(0deg,#f4d28a,#ff7a3c)';
  });
  $('help').textContent =
    (padName ? '🎮 ' + padName.slice(0, 34) : '🎮 未接続（ボタンを押すと認識）') + '\n' +
    '左右スティック上下：その側の肩を乗り出す／引く　左右：腕を振る　LT / RT：その腕のひじを伸ばす（離すと曲がって手が上がる）\n' +
    'めん棒を転がす動きを、肩とひじに分けて組み立てる。勢いよく下ろすと叩きつけて穴があく／押しつけすぎると破れる\n' +
    'キーボード：左 WASD・Q ／ 右 矢印・M ／ R やり直し';
}

// =====================================================================
// ループ
// =====================================================================
const camBase = new THREE.Vector3();
function resize() {
  const w = Math.max(1, innerWidth), hh = Math.max(1, innerHeight);
  renderer.setSize(w, hh); camera.aspect = w / hh; camera.updateProjectionMatrix();
  const k = Math.max(1, 1.5 / camera.aspect);
  camBase.set(0, 12 * k, 9.5 * k); camera.position.copy(camBase); camera.lookAt(0, 0, 0.6);
}
addEventListener('resize', resize);
resize();
resetGame();
window.G = { get lop() { return lop; }, shapeInfo, get pinTouch() { return pinTouch; }, get parts() { return parts; }, hands, pin, CFG, get tension() { return tension; }, get cover() { return cover; }, get round() { return round; },
  get fails() { return fails; }, get done() { return done; }, get failing() { return failing; }, centroid };

let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(1 / 30, (now - last) / 1000); last = now;
  if (renderer.domElement.width !== Math.round(innerWidth * renderer.getPixelRatio())) resize();
  updatePin(dt);
  if (parts.length) step(1 / 60);
  if (failing) {
    failing.t += dt;
    if (failing.t >= CFG.FAIL_SHOW && parts.length) { parts = []; springs = []; respawnT = 0.3; }
    if (respawnT > 0) { respawnT -= dt; if (respawnT <= 0) { respawnT = 0; spawnDough(true); } }
  }
  updateFx(dt);
  shake *= Math.exp(-dt * 8);
  camera.position.copy(camBase);
  if (shake > 0.01) camera.position.add(new THREE.Vector3((Math.random() - .5) * shake, (Math.random() - .5) * shake, 0));
  camera.lookAt(0, 0, 0.6);
  syncScene(now / 1000);
  hud(now);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
</script>
