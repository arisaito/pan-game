<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Pan Kneading</title>
<style>
  html, body { margin: 0; height: 100%; background: #6b4a33; overflow: hidden; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hud {
    position: fixed; left: 12px; bottom: 10px; color: #f3e6d6; font-size: 12px; line-height: 1.6;
    background: rgba(0,0,0,.35); padding: 6px 10px; border-radius: 8px; pointer-events: none; white-space: pre;
  }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"></div>
<script>
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
const hud = document.getElementById('hud');
const shadowCv = document.createElement('canvas');
const sctx = shadowCv.getContext('2d');
const doughCv = document.createElement('canvas');
const dctx = doughCv.getContext('2d');
let W, H, DPR;
function resize() {
  DPR = window.devicePixelRatio || 1;
  W = innerWidth; H = innerHeight;
  for (const c of [cv, shadowCv, doughCv]) { c.width = W * DPR; c.height = H * DPR; }
  cv.style.width = W + 'px'; cv.style.height = H + 'px';
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

// =====================================================================
// 設定
// =====================================================================
const CFG = {
  // 手の位置 = ホーム + スティックの倒し具合 × 可動範囲（スティックを離すとホームに戻る）
  homeX: 0.14,        // ホームの位置：画面中央から左右へ（画面幅に対する割合）
  homeY: 0.03,        // ホームの位置：画面中央から下へ（画面高さに対する割合）
  reachX: 0.38,       // 倒しきった時に動く距離（画面幅に対する割合）
  reachY: 0.42,       // 同（画面高さに対する割合）
  follow: 22,         // 目標位置への追従の速さ（大きいほどキビキビ）
  stickCurve: 0.8,    // 1未満ほど、少し倒しただけで大きく動く
  deadzone: 0.1,
  grabRadius: 40,     // この距離内に生地があればつかめる
  grabCluster: 24,    // つかんだ点の周り、この半径の生地をまとめて持つ
  grabThreshold: 0.5,
  handScale: 1.0,
  spacing: 16,        // 生地の粒子間隔
  doughRadius: 95,
  iterations: 10,
  damping: 0.975,     // 慣性の残り具合（1に近いほど滑る）
  bounce: 0.7,        // 画面端での跳ね返り係数
  GAIN: 0.0025,     // こねた度の上がりやすさ（じわじわ分。メインは「いい伸び」ボーナス）

  // ---- A：伸び・ちぎれ ----
  // 張り（テンション）= 一番伸びているバネ上位8本の平均ひずみ（なめらかに）
  // こねるほどグルテンが強くなり、各しきい値が (1 + TENSION_GROW × こねた度) 倍に上がる
  GOOD_LO: 0.35,      // ここから「いい伸び」
  GOOD_HI: 0.65,      // ここから「ギリギリ」（危険ゾーン）
  TEAR: 1.1,          // これを超えた状態が TEAR_HOLD 秒続くとちぎれる
  TEAR_HOLD: 0.3,
  FLOW_BOOST: 8,      // 張りが強い時に生地が伸びて逃げる度合い（大きいほどちぎれにくい）
      // 一瞬の引っぱりすぎでは切れない（赤＋強い振動で警告→緩めれば助かる）
  TENSION_GROW: 0.6,
  BONUS_GOOD: 4,      // いい伸び！
  BONUS_EDGE: 7,      // ギリギリ！（欲張った分おいしい）

  // ---- C：まな板から落ちる ----
  BOARD_X: 0.09,      // まな板の左右の余白（画面幅比）
  BOARD_TOP: 142,     // まな板の上端（px）
  BOARD_BOTTOM: 30,   // まな板の下の余白（px）
  FALL_FRAC: 0.6,     // 生地のこの割合以上がまな板の外に出たら落ちる（つかんでいない時）

  // ---- 失敗：ちぎれる／落ちる → その生地は消えて、新しい生地が降ってくる ----
  FAIL_SHOW: 0.75,    // 失敗の様子を見せる時間
  DROP_TIME: 0.55,    // 新しい生地が降ってくる時間
};

// =====================================================================
// こねた度（0〜100）の定義
//   生地はバネでつながった粒子。バネが一定以上（降伏ひずみ）伸び縮みすると
//   静止長そのものが変わる＝塑性変形する。
//   この「塑性変形した量の合計」を、手を動かしながら生み出した分だけ
//   こねた度として加算する（グルテンが伸ばされ・折りたたまれた量に相当）。
//   こねた度が上がるほど生地は「べたべた・ゆるい」→「なめらか・弾力がある」に変化する。
// =====================================================================
let kneaded = 0;           // こねた度 0..100
let flowRate = 0;          // 直近のこね速度（表示用）
let done = false, startTime = null, endTime = null, doneAt = 0;

const STAGES = [
  { at: 0,   name: 'べたべた',        tip: '両手でつかんで引き伸ばそう' },
  { at: 20,  name: 'まとまってきた',  tip: '伸ばしたら折りたたむ、をくり返そう' },
  { at: 50,  name: 'なめらか',        tip: 'いい感じ！弾力が出てきた' },
  { at: 80,  name: 'グルテン膜',      tip: 'あと少し！' },
  { at: 100, name: 'こね上がり',      tip: '' },
];
const stageOf = v => { let s = STAGES[0]; for (const st of STAGES) if (v >= st.at) s = st; return s; };

// =====================================================================
// 生地（粒子 + 塑性バネ）
// =====================================================================
let parts = [], springs = [];
let tension = 0, holdPeak = 0, overT = 0;
let popups = [], falling = [], respawnT = 0, edgeWarn = 0;
let fails = 0;                 // 失敗した回数
let failing = null;            // 失敗演出中 { reason, t }
let dropT = 1;                 // 新しい生地の落下アニメ 0→1（1で着地済み）

// ゲーム全体をやり直す（R / Start）
function makeDough() {
  fails = 0; startTime = null; endTime = null;
  popups = []; falling = [];
  spawnDough(false);
}
// 新しい生地（こねた度は 0 から）。drop=true なら上から降ってくる
function spawnDough(drop = true) {
  parts = []; springs = [];
  tension = 0; holdPeak = 0; overT = 0; failing = null; respawnT = 0;
  dropT = drop ? 0 : 1;
  kneaded = 0; done = false; flowRate = 0;
  const s = CFG.spacing, cx = W / 2, cy = H / 2 - 20, R = CFG.doughRadius;
  // 同心円状に並べる（丸い生地玉になるように）
  const rings = Math.round(R / s);
  for (let ri = 0; ri <= rings; ri++) {
    const rr = ri * s, n = ri === 0 ? 1 : Math.round(2 * Math.PI * ri);
    const off = Math.random() * Math.PI * 2;
    for (let k = 0; k < n; k++) {
      const a = off + k / n * Math.PI * 2;
      const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr;
      parts.push({ x, y, px: x, py: y, held: null,
        j: Math.random(), fx: Math.random() - 0.5, fy: Math.random() - 0.5 });
    }
  }
  for (let i = 0; i < parts.length; i++) for (let j = i + 1; j < parts.length; j++) {
    const d = Math.hypot(parts[i].x - parts[j].x, parts[i].y - parts[j].y);
    if (d < s * 1.35) springs.push({ a: parts[i], b: parts[j], rest0: d, rest: d, near: true });
    else if (d < s * 2.05) springs.push({ a: parts[i], b: parts[j], rest0: d, rest: d, near: false });
  }
  for (const h of hands) { h.holding = null; h.sticky = null; }
}

// =====================================================================
// A：張り・ちぎれ
// =====================================================================
const kScale = () => 1 + CFG.TENSION_GROW * kneaded / 100;
const TH = () => { const s = kScale(); return { lo: CFG.GOOD_LO * s, hi: CFG.GOOD_HI * s, tear: CFG.TEAR * s }; };
const strainOf = sp => (Math.hypot(sp.b.x - sp.a.x, sp.b.y - sp.a.y) - sp.rest) / sp.rest;
const centroid = () => { let x = 0, y = 0; for (const p of parts) { x += p.x; y += p.y; } return { x: x / parts.length, y: y / parts.length }; };

function popup(x, y, text, col, big = false) {
  popups.push({ x, y, text, col, t: 0, big });
}

function measureTension(dt) {
  const arr = [];
  for (const sp of springs) if (sp.near) arr.push(strainOf(sp));
  arr.sort((a, b) => b - a);
  let s = 0; const n = Math.min(8, arr.length);
  for (let i = 0; i < n; i++) s += arr[i];
  const v = n ? s / n : 0;
  tension += (v - tension) * Math.min(1, dt * 18);
}

// ちぎれ：張りがしきい値を超えたら、一番伸びた所でブチッと切れて失敗
function tearStep(dt) {
  if (tension < TH().tear) { overT = 0; return; }
  overT += dt;
  if (overT < CFG.TEAR_HOLD) return;
  overT = 0;
  let worst = null, ws = 0;
  for (const sp of springs) { const s = strainOf(sp); if (s > ws) { ws = s; worst = sp; } }
  if (!worst) return;
  const mx = (worst.a.x + worst.b.x) / 2, my = (worst.a.y + worst.b.y) / 2;
  // 切れ目に沿ってまとめて切る（パッと2つに分かれる）
  const nx = worst.b.x - worst.a.x, ny = worst.b.y - worst.a.y, nl = Math.hypot(nx, ny) || 1;
  springs = springs.filter(sp => {
    const da = ((sp.a.x - mx) * nx + (sp.a.y - my) * ny) / nl;
    const db = ((sp.b.x - mx) * nx + (sp.b.y - my) * ny) / nl;
    return !(da * db < 0); // 切れ目の線をまたぐバネを全部切る
  });
  for (let i = 0; i < 16; i++) flour(mx, my, 1);
  fail('ちぎれた！', mx, my);
}

// =====================================================================
// 失敗 → 生地が消えて、新しい生地が降ってくる
// =====================================================================
function fail(reason, x, y) {
  if (failing || done) return;
  failing = { reason, t: 0 };
  fails++;
  for (const h of hands) {
    if (h.holding) for (const g of h.holding) g.p.held = null;
    h.holding = null; h.sticky = null;
  }
  holdPeak = 0;
  const c = parts.length ? centroid() : { x: W / 2, y: H / 2 };
  popup(x ?? c.x, (y ?? c.y) - 30, reason, '#ff7a5c', true);
  rumble(1, 0.9, 260);
}

function updateFail(dt) {
  if (!failing) return;
  failing.t += dt;
  if (failing.t >= CFG.FAIL_SHOW && parts.length) {
    // 生地を消す（ふっと小さくなって消える）
    for (const p of parts) falling.push({ x: p.x, y: p.y, vx: (p.x - p.px) * 30, vy: (p.y - p.py) * 30, t: 0, j: p.j, fade: true });
    parts = []; springs = [];
    respawnT = 0.25;
  }
}

// =====================================================================
// C：まな板と落下
// =====================================================================
function boardRect() {
  const x0 = W * CFG.BOARD_X, x1 = W * (1 - CFG.BOARD_X);
  return { x0, x1, y0: CFG.BOARD_TOP, y1: H - CFG.BOARD_BOTTOM };
}
function offBoard(p, b) { return p.x < b.x0 || p.x > b.x1 || p.y < b.y0 || p.y > b.y1; }

function fallStep() {
  const b = boardRect();
  let out = 0, held = false;
  for (const p of parts) { if (offBoard(p, b)) out++; if (p.held) held = true; }
  const frac = out / parts.length;
  edgeWarn = Math.min(1, frac / CFG.FALL_FRAC);
  if (!held && frac >= CFG.FALL_FRAC) {
    const c = centroid();
    // まな板の外へ落ちていく
    for (const p of parts) falling.push({ x: p.x, y: p.y, vx: (p.x - p.px) * 60, vy: (p.y - p.py) * 60, t: 0, j: p.j });
    parts = []; springs = [];
    fail('落ちた！', Math.min(Math.max(c.x, 80), W - 80), Math.min(Math.max(c.y, 170), H - 60));
    failing.t = CFG.FAIL_SHOW; // もう消えているので、すぐ次へ
    respawnT = 0.5;
  }
}

function stepDough(dt) {
  const k = kneaded / 100;
  const stiff = 0.12 + 0.15 * k;           // 弾力（低いほどビヨンと揺れる）
  const yieldS = 0.1 + 0.05 * k;           // 降伏ひずみ（これ以上伸ばすと形が残る）
  const plast = 3 - 2 * k;                 // 塑性の流れやすさ
  const recov = 0.15 + 0.6 * k;            // 元の形に戻ろうとする力

  for (const p of parts) {
    if (p.held) { p.px = p.x; p.py = p.y; continue; }
    const vx = (p.x - p.px) * CFG.damping, vy = (p.y - p.py) * CFG.damping;
    p.px = p.x; p.py = p.y; p.x += vx; p.y += vy;
  }
  // 手を離した直後、まだ柔らかい生地は手にくっついてくる
  for (const h of hands) if (h.sticky) {
    h.sticky.t -= dt;
    let far = false;
    for (const g of h.sticky.list) {
      const tx = h.x + g.ox, ty = h.y + g.oy;
      if (Math.hypot(tx - g.p.x, ty - g.p.y) > 70) far = true;
      g.p.x += (tx - g.p.x) * 0.12; g.p.y += (ty - g.p.y) * 0.12;
    }
    if (h.sticky.t <= 0 || far) h.sticky = null;
  }

  const minD = CFG.spacing * 0.8;
  for (let it = 0; it < CFG.iterations; it++) {
    for (const h of hands) if (h.holding) for (const g of h.holding) { g.p.x = h.x + g.ox; g.p.y = h.y + g.oy; }
    for (const sp of springs) {
      const a = sp.a, b = sp.b;
      const dx = b.x - a.x, dy = b.y - a.y;
      const d = Math.hypot(dx, dy) || 1e-4;
      const wa = a.held ? 0 : 1, wb = b.held ? 0 : 1, ws = wa + wb;
      if (!ws) continue;
      const f = (d - sp.rest) / d * (sp.near ? stiff : stiff * 0.5);
      a.x += dx * f * wa / ws; a.y += dy * f * wa / ws;
      b.x -= dx * f * wb / ws; b.y -= dy * f * wb / ws;
    }
    if (it === 0 || it === CFG.iterations - 1) {
      // 体積を保つための反発（つぶれ防止）
      for (let i = 0; i < parts.length; i++) {
        const a = parts[i];
        for (let j = i + 1; j < parts.length; j++) {
          const b = parts[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          if (dx > minD || dx < -minD || dy > minD || dy < -minD) continue;
          const d = Math.hypot(dx, dy) || 1e-4;
          if (d >= minD) continue;
          const wa = a.held ? 0 : 1, wb = b.held ? 0 : 1, ws = wa + wb;
          if (!ws) continue;
          const f = (d - minD) / d * 0.5;
          a.x += dx * f * wa / ws; a.y += dy * f * wa / ws;
          b.x -= dx * f * wb / ws; b.y -= dy * f * wb / ws;
        }
      }
    }
  }
  // 画面端で跳ね返る
  const m = 10, e = CFG.bounce;
  for (const p of parts) {
    if (p.held) continue;
    const vx = p.x - p.px, vy = p.y - p.py;
    if (p.x < m)     { p.x = m;     if (vx < 0) p.px = p.x + vx * e; }
    if (p.x > W - m) { p.x = W - m; if (vx > 0) p.px = p.x + vx * e; }
    if (p.y < m)     { p.y = m;     if (vy < 0) p.py = p.y + vy * e; }
    if (p.y > H - m) { p.y = H - m; if (vy > 0) p.py = p.y + vy * e; }
  }

  // 張りを測って、限界を超えたらちぎれる
  measureTension(dt);
  if (hands.some(h => h.holding)) holdPeak = Math.max(holdPeak, tension);
  if (!failing) tearStep(dt);

  // 塑性変形 → こねた度
  let flow = 0;
  const pl = Math.min(1, plast * dt);
  for (const sp of springs) {
    const len = Math.hypot(sp.b.x - sp.a.x, sp.b.y - sp.a.y);
    const strain = (len - sp.rest) / sp.rest;
    if (Math.abs(strain) > yieldS) {
      const target = len - Math.sign(strain) * yieldS * sp.rest;
      // 強く伸ばされているほど生地が流れて伸びる（ゆっくり引けばちぎれずに長く伸びる）
      const boost = 1 + CFG.FLOW_BOOST * Math.max(0, Math.abs(strain) - yieldS * 2);
      const d = (target - sp.rest) * Math.min(1, pl * boost);
      sp.rest += d;
      flow += Math.abs(d) / sp.rest0 * (sp.near ? 1 : 0.5);
    }
    sp.rest += (sp.rest0 - sp.rest) * Math.min(1, recov * dt);
    sp.rest = Math.max(sp.rest0 * 0.5, Math.min(sp.rest0 * 2.5, sp.rest));
  }
  // 手を動かしている時だけカウント（持ったまま静止では上がらない）
  let move = 0;
  for (const h of hands) if (h.holding) move += h.speed;
  const moveGate = Math.min(1, move / 250);
  // 生地が固くなるほど塑性変形が減るので、後半の伸び悩みを補正
  const gain = failing ? 0 : flow * CFG.GAIN * moveGate * (1 + 1.2 * k);
  flowRate += (gain / Math.max(dt, 1e-3) - flowRate) * Math.min(1, dt * 6);
  if (!done) addKneaded(gain);

  // まな板から落ちる
  if (!failing && parts.length) fallStep();
}

function addKneaded(v) {
  if (done) return;
  kneaded = Math.min(100, kneaded + v);
  if (kneaded >= 100) { done = true; endTime = performance.now(); doneAt = endTime; rumbleAll(1, 400); }
}

// 伸ばして離した時の判定（1回の伸ばしごとに 成功／失敗 が出る）
function judgeStretch(h) {
  const th = TH();
  if (!failing && holdPeak >= th.lo) {
    const edge = holdPeak >= th.hi;
    addKneaded(edge ? CFG.BONUS_EDGE : CFG.BONUS_GOOD);
    popup(h.x, h.y - 50, edge ? 'ギリギリ！ +' + CFG.BONUS_EDGE : 'いい伸び！ +' + CFG.BONUS_GOOD, edge ? '#ffd36a' : '#bdf08a', edge);
    rumble(edge ? 0.7 : 0.45, edge ? 0.6 : 0.5, edge ? 160 : 110);
    for (let i = 0; i < (edge ? 18 : 10); i++) flour(h.x, h.y, edge ? 1.2 : 0.8);
  }
  holdPeak = 0;
}

// 粉が舞う
let dust = [];
function flour(x, y, power) {
  const a = Math.random() * Math.PI * 2, s = (40 + Math.random() * 160) * power;
  dust.push({ x: x + Math.cos(a) * 20, y: y + Math.sin(a) * 20, vx: Math.cos(a) * s, vy: Math.sin(a) * s, t: 0, life: 0.5 + Math.random() * 0.5, r: 1.5 + Math.random() * 2.5 });
}

// =====================================================================
// 手 / 入力
// =====================================================================
const hands = [
  { name: 'L', x: 0, y: 0, grip: 0, vis: 0, tilt: 0, mirror: -1, holding: null, sticky: null, speed: 0, color: '#4a8fd8', prevGrip: false },
  { name: 'R', x: 0, y: 0, grip: 0, vis: 0, tilt: 0, mirror: 1, holding: null, sticky: null, speed: 0, color: '#d8604f', prevGrip: false },
];
// ホームポジション：生地の左右
const homeOf = i => ({ x: W / 2 + (i === 0 ? -1 : 1) * W * CFG.homeX, y: H / 2 + H * CFG.homeY });
hands.forEach((h, i) => { const p = homeOf(i); h.x = p.x; h.y = p.y; });

const keys = {};
let showDebug = false;
addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'KeyR') makeDough();
  if (e.code === 'KeyI') showDebug = !showDebug;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.code)) e.preventDefault();
});
addEventListener('keyup', e => { keys[e.code] = false; });

// スティックを円形デッドゾーン + カーブで補正した 2D ベクトルにする
function stick(x, y) {
  const m = Math.hypot(x, y);
  if (m < CFG.deadzone) return [0, 0];
  const n = Math.pow(Math.min(1, (m - CFG.deadzone) / (1 - CFG.deadzone)), CFG.stickCurve);
  return [x / m * n, y / m * n];
}

let padName = '', padDebug = '', curPad = null, startPrev = false;
function readInput() {
  const input = [{ x: 0, y: 0, grip: 0 }, { x: 0, y: 0, grip: 0 }];
  const pads = navigator.getGamepads ? navigator.getGamepads() : [];
  let pad = null;
  for (const p of pads) if (p && p.connected) { pad = p; break; }
  curPad = pad;
  padName = pad ? pad.id : '';
  padDebug = '';
  if (pad) {
    padDebug = 'mapping: ' + (pad.mapping || '(非標準)') + '\n' +
      'axes: ' + pad.axes.map((v, i) => i + ':' + v.toFixed(2)).join('  ') + '\n' +
      'buttons: ' + (pad.buttons.map((b, i) => b.value > 0.05 ? i + '(' + b.value.toFixed(2) + ')' : null).filter(Boolean).join(' ') || '-');
    [input[0].x, input[0].y] = stick(pad.axes[0] || 0, pad.axes[1] || 0);
    [input[1].x, input[1].y] = stick(pad.axes[2] || 0, pad.axes[3] || 0);
    input[0].grip = pad.buttons[6] ? pad.buttons[6].value : 0;
    input[1].grip = pad.buttons[7] ? pad.buttons[7].value : 0;
    const st = pad.buttons[9] && pad.buttons[9].pressed;
    if (st && !startPrev) makeDough();
    startPrev = st;

  const k = c => keys[c] ? 1 : 0;
  input[0].x += k('KeyD') - k('KeyA'); input[0].y += k('KeyS') - k('KeyW');
  input[1].x += k('ArrowRight') - k('ArrowLeft'); input[1].y += k('ArrowDown') - k('ArrowUp');
  if (keys['Space']) input[0].grip = 1;
  if (keys['Enter']) input[1].grip = 1;
  return input;
}

function rumble(strong, weak, ms) {
  const act = curPad && curPad.vibrationActuator;
  if (act && act.playEffect) act.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: weak }).catch(() => {});
}
const rumbleAll = (s, ms) => rumble(s, s, ms);

function nearestPart(x, y, r) {
  let best = null, bd = r * r;
  for (const p of parts) {
    if (p.held) continue;
    const d = (p.x - x) ** 2 + (p.y - y) ** 2;
    if (d < bd) { bd = d; best = p; }
  }
  return best;
}

function grab(h) {
  if (failing || dropT < 1 || !parts.length) return false;
  const c = nearestPart(h.x, h.y, CFG.grabRadius);
  if (!c) return false;
  const list = [];
  for (const p of parts) {
    if (p.held) continue;
    if (Math.hypot(p.x - c.x, p.y - c.y) < CFG.grabCluster) {
      p.held = h;
      // 握るとぎゅっと寄る
      list.push({ p, ox: (p.x - c.x) * 0.7, oy: (p.y - c.y) * 0.7 });
    }
  }
  h.holding = list;
  h.sticky = null;

}
function release(h) {
  judgeStretch(h);

  if (k < 0.9) h.sticky = { list: h.holding, t: 0.45 * (1 - k) };

}

let rumbleT = 0;
function updateHands(dt) {
  const input = readInput();
  hands.forEach((h, i) => {
    const inp = input[i];
    const ox = h.x, oy = h.y;
    const mx = Math.max(-1, Math.min(1, inp.x)), my = Math.max(-1, Math.min(1, inp.y));
    // スティックの倒し具合 = ホームポジションからのずれ。離せばホームに戻る
    const home = homeOf(i);
    const tx = Math.max(0, Math.min(W, home.x + mx * W * CFG.reachX));
    const ty = Math.max(0, Math.min(H, home.y + my * H * CFG.reachY));
    const f = Math.min(1, dt * CFG.follow);
    h.x += (tx - h.x) * f;
    h.y += (ty - h.y) * f;
    h.speed = Math.hypot(h.x - ox, h.y - oy) / Math.max(dt, 1e-3);
    h.grip = inp.grip;
    const gripping = h.grip > CFG.grabThreshold;
    if (gripping && !h.prevGrip && grab(h)) rumble(0.5, 0.3, 60);
    if (!gripping && h.holding) release(h);
    h.prevGrip = gripping;
    let target = Math.min(1, h.grip / 0.55);
    if (h.holding) target = 1;
    h.vis += (target - h.vis) * Math.min(1, dt * 18);
    const sx = W * (i === 0 ? 0.35 : 0.65), sy = H + 260;
    h.tilt = Math.max(-0.9, Math.min(0.9, Math.atan2(h.x - sx, sy - h.y)));
  });
  // こねている手応え
  // 張りが強いほど、だんだん強く震える（ちぎれそうな予兆）
  rumbleT -= dt;
  const th = TH();
  const holding = hands.some(h => h.holding);
  if (rumbleT <= 0 && holding && tension > th.lo * 0.6 && !done) {
    const u = Math.min(1, tension / th.tear);
    rumble(Math.min(1, u * u * 0.9), Math.min(1, 0.15 + u * 0.6), 90);
    rumbleT = 0.08;
  } else if (rumbleT <= 0 && flowRate > 1 && !done) {
    rumble(Math.min(0.4, flowRate * 0.04), Math.min(0.3, flowRate * 0.03), 90);
    rumbleT = 0.1;
  }
}

// =====================================================================
// 手の描画（手の甲を上から見た図）
// =====================================================================
const SKIN = '#f0c4a0', SKIN_DARK = '#d9a07c', OUTLINE = '#6b3f2a', NAIL = '#f8ddd0';
const FLEX = [1.2, 1.5, 0.9];
const THUMB_FLEX = [0.35, 0.8, 0.7];
const FINGERS = [
  { base: [-14, 0],  ang: -0.07, len: [22, 15, 13], w: [12, 11, 10] },
  { base: [-4, -2],  ang: 0.0,   len: [24, 17, 14], w: [12.5, 11.5, 10.5] },
  { base: [6, 0],    ang: 0.07,  len: [22, 16, 13], w: [11.5, 10.5, 9.5] },
  { base: [15, 5],   ang: 0.18,  len: [17, 12, 11], w: [10, 9, 8.5] },
];
const THUMB = { base: [-21, 28], len: [25, 19, 14], w: [15, 13, 11.5], openAng: -0.72, openCurl: 0.15 };
const PINCH_LEN = 28;

function projLen(len, flex, c) {
  let cum = 0, s = 0;
  for (let i = 0; i < len.length; i++) { cum += flex[i] * c; s += len[i] * Math.cos(cum); }
  return s;
}
function solveCurl(len, flex, target) {
  let lo = 0, hi = 1;
  for (let i = 0; i < 30; i++) { const m = (lo + hi) / 2; if (projLen(len, flex, m) > target) lo = m; else hi = m; }
  return (lo + hi) / 2;
}
function chain(base, ang, len, flex, c) {
  const dx = Math.sin(ang), dy = -Math.cos(ang);
  const j = [{ x: base[0], y: base[1], cos: 1 }];
  let cum = 0, x = base[0], y = base[1];
  for (let i = 0; i < len.length; i++) {
    cum += flex[i] * c;
    const L = len[i] * Math.cos(cum);
    x += dx * L; y += dy * L;
    j.push({ x, y, cos: Math.cos(cum) });
  }
  return { j, dx, dy };
}
const IDX = FINGERS[0];
const PINCH = { x: IDX.base[0] + Math.sin(IDX.ang) * PINCH_LEN, y: IDX.base[1] - Math.cos(IDX.ang) * PINCH_LEN };
const IDX_CLOSED = solveCurl(IDX.len, FLEX, PINCH_LEN);
const THUMB_CLOSED_ANG = Math.atan2(PINCH.x - THUMB.base[0], -(PINCH.y - THUMB.base[1]));
const THUMB_CLOSED = solveCurl(THUMB.len, THUMB_FLEX,
  Math.hypot(PINCH.x - THUMB.base[0], PINCH.y - THUMB.base[1]) - 3);

function handPose(g) {
  const lerp = (a, b) => a + (b - a) * g;
  const fingers = FINGERS.map((f, i) => {
    const c = i === 0 ? lerp(0.08, IDX_CLOSED) : lerp(0.08 + i * 0.03, 0.38 + i * 0.06);
    return { ...chain(f.base, f.ang, f.len, FLEX, c), w: f.w };
  });
  const thumb = { ...chain(THUMB.base, lerp(THUMB.openAng, THUMB_CLOSED_ANG), THUMB.len, THUMB_FLEX,
    lerp(THUMB.openCurl, THUMB_CLOSED)), w: THUMB.w };

}
function palmPath(c) {
  c.beginPath();
  c.moveTo(-20, -1);
  c.quadraticCurveTo(-2, -9, 20, 4);
  c.quadraticCurveTo(25, 30, 17, 56);
  c.lineTo(-17, 56);
  c.quadraticCurveTo(-30, 34, -20, -1);
  c.closePath();
}
function armPath(c) {

}
function strokeFinger(c, f, extra) {

    c.beginPath(); c.moveTo(f.j[i].x, f.j[i].y); c.lineTo(f.j[i + 1].x, f.j[i + 1].y); c.stroke();

function drawMainGroup(c, pose, color, extra) {

  palmPath(c); c.fill(); if (extra) { c.lineWidth = extra; c.stroke(); }

  for (const f of pose.fingers) drawDetails(c, f);

  c.strokeStyle = 'rgba(0,0,0,.35)'; c.lineWidth = 2; c.stroke();

}
// 爪だけ描く
function drawDetails(c, f) {
  const a = f.j[2], b = f.j[3];

function drawHands() {
  sctx.setTransform(1, 0, 0, 1, 0, 0);

// 生地・台・UIの描画

const mix = (a, b, t) => a.map((v, i) => Math.round(v + (b[i] - v) * t));
const rgb = (c, a = 1) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

function drawBlob(c, extra, k) {
  const r = CFG.spacing * 0.78;
  c.lineCap = 'round';
  for (const sp of springs) {
    if (!sp.near) continue;
    const len = Math.hypot(sp.b.x - sp.a.x, sp.b.y - sp.a.y);
    const thin = Math.max(0.3, Math.min(1, sp.rest0 * 1.15 / len));
    c.lineWidth = 2 * r * thin + extra * 2;
    c.beginPath(); c.moveTo(sp.a.x, sp.a.y); c.lineTo(sp.b.x, sp.b.y); c.stroke();
  }
  for (const p of parts) {
    const rr = r * (1 + (p.j - 0.5) * 0.4 * (1 - k)) + extra;
    c.beginPath(); c.arc(p.x, p.y, rr, 0, Math.PI * 2); c.fill();
  }

function drawDough() {
  drawFalling();
  if (!parts.length) return;
  const k = kneaded / 100;
  dctx.setTransform(1, 0, 0, 1, 0, 0);
  dctx.clearRect(0, 0, doughCv.width, doughCv.height);
  dctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const out = mix([176, 140, 98], [214, 176, 128], k);
  const body = mix([226, 210, 176], [252, 240, 216], k);
  dctx.fillStyle = dctx.strokeStyle = rgb(out);
  drawBlob(dctx, 2.5, k);
  dctx.fillStyle = dctx.strokeStyle = rgb(body);

  // 生地の上に陰影・質感を重ねる
  dctx.globalCompositeOperation = 'source-atop';
  let cx = 0, cy = 0;
  for (const p of parts) { cx += p.x; cy += p.y; }
  cx /= parts.length; cy /= parts.length;
  let rad = 0;
  for (const p of parts) rad = Math.max(rad, Math.hypot(p.x - cx, p.y - cy));
  const g = dctx.createRadialGradient(cx - rad * 0.3, cy - rad * 0.35, 0, cx, cy, rad * 1.15);
  g.addColorStop(0, `rgba(255,255,255,${0.12 + 0.45 * k})`);
  g.addColorStop(0.45, 'rgba(255,255,255,0)');
  g.addColorStop(1, 'rgba(120,80,40,0.25)');
  dctx.fillStyle = g;
  dctx.fillRect(cx - rad * 1.5, cy - rad * 1.5, rad * 3, rad * 3);

  const rough = 1 - k;
  if (rough > 0.02) {
    for (const p of parts) {
      if (p.j < 0.35) {
        dctx.fillStyle = `rgba(150,115,75,${0.18 * rough})`;
        dctx.beginPath(); dctx.arc(p.x + p.fx * 6, p.y + p.fy * 6, 3 + p.j * 6, 0, Math.PI * 2); dctx.fill();

    ctx.strokeStyle = `rgba(255,80,50,${(0.25 + 0.35 * Math.sin(now / 70)) * edgeWarn + 0.2 * edgeWarn})`;
    ctx.lineWidth = 6;
    roundRect(ctx, b.x0, b.y0, b.x1 - b.x0, b.y1 - b.y0, 18); ctx.stroke();
  }
}

// 落ちていく生地のかけら（まな板の外へ落ちて小さく消える）
function drawFalling() {
  const k = kneaded / 100;
  const body = mix([226, 210, 176], [252, 240, 216], k);
  for (const f of falling) {
    const s = Math.max(0, 1 - f.t * 1.4);
    if (s <= 0) continue;
    ctx.fillStyle = rgb(body, f.fade ? s : Math.min(1, s * 1.5));
    ctx.beginPath(); ctx.arc(f.x, f.y + f.t * f.t * 120, CFG.spacing * 0.8 * s, 0, Math.PI * 2); ctx.fill();
  }
}
function updateFx(dt) {
  for (const f of falling) { f.t += dt; f.x += f.vx * dt; f.y += f.vy * dt; f.vx *= 0.95; f.vy *= 0.95; }
  falling = falling.filter(f => f.t < 0.75);
  for (const d of dust) { d.t += dt; d.x += d.vx * dt; d.y += d.vy * dt; d.vx *= 0.9; d.vy *= 0.9; }
  dust = dust.filter(d => d.t < d.life);
  for (const p of popups) p.t += dt;
  popups = popups.filter(p => p.t < 1.1);
}
function drawFx() {
  for (const d of dust) {
    ctx.fillStyle = `rgba(255,252,242,${0.85 * (1 - d.t / d.life)})`;
    ctx.beginPath(); ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2); ctx.fill();
  }
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  for (const p of popups) {
    const a = Math.min(1, (1.1 - p.t) * 3);
    const sc = p.t < 0.12 ? 1.4 - p.t / 0.12 * 0.4 : 1;
    ctx.save();
    ctx.globalAlpha = a;
    ctx.translate(p.x, p.y - p.t * 40);
    ctx.scale(sc, sc);
    ctx.font = `bold ${p.big ? 30 : 22}px system-ui`;
    ctx.lineWidth = 6; ctx.strokeStyle = 'rgba(40,20,10,.75)';
    ctx.strokeText(p.text, 0, 0);
    ctx.fillStyle = p.col; ctx.fillText(p.text, 0, 0);
    ctx.restore();
  }
  ctx.textBaseline = 'alphabetic';
}

// 張りメーター（つかんでいる間だけ出る）
let gaugeVis = 0;
function drawGauge(dt) {
  const holding = hands.some(h => h.holding);
  gaugeVis += ((holding ? 1 : 0) - gaugeVis) * Math.min(1, dt * 10);
  if (gaugeVis < 0.02) return;
  const th = TH();
  const max = th.tear * 1.15;
  const bw = Math.min(360, W - 60), bh = 14, bx = (W - bw) / 2, by = 112;
  ctx.save();
  ctx.globalAlpha = gaugeVis;
  ctx.fillStyle = 'rgba(40,25,15,.6)'; roundRect(ctx, bx - 10, by - 8, bw + 20, bh + 16, 10); ctx.fill();
  ctx.fillStyle = 'rgba(255,255,255,.12)'; roundRect(ctx, bx, by, bw, bh, 7); ctx.fill();
  const zx = v => bx + bw * Math.min(1, v / max);
  ctx.fillStyle = 'rgba(130,210,90,.75)'; ctx.fillRect(zx(th.lo), by, zx(th.hi) - zx(th.lo), bh);
  ctx.fillStyle = 'rgba(255,190,70,.8)'; ctx.fillRect(zx(th.hi), by, zx(th.tear) - zx(th.hi), bh);
  ctx.fillStyle = 'rgba(230,70,50,.85)'; ctx.fillRect(zx(th.tear), by, bx + bw - zx(th.tear), bh);
  // 今回の最大
  if (holdPeak > 0.02) { ctx.fillStyle = 'rgba(255,255,255,.6)'; ctx.fillRect(zx(holdPeak) - 1, by - 3, 2, bh + 6); }
  // 今の張り
  const x = zx(tension);
  ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.moveTo(x, by - 4); ctx.lineTo(x - 6, by - 11); ctx.lineTo(x + 6, by - 11); ctx.fill();
  ctx.fillRect(x - 2, by - 2, 4, bh + 4);
  ctx.restore();
}

function fmtTime(ms) {
  const s = Math.floor(ms / 1000);
  return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
}

function drawUI(now) {
  const bw = Math.min(460, W - 40), bh = 18, bx = (W - bw) / 2, by = 46;
  // パネル
  ctx.fillStyle = 'rgba(40,25,15,.55)';
  roundRect(ctx, bx - 16, 10, bw + 32, 92, 12); ctx.fill();
  ctx.fillStyle = '#fff3e0'; ctx.font = 'bold 15px system-ui'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillText('こねた度', bx, 36);
  ctx.textAlign = 'right'; ctx.font = 'bold 24px system-ui';
  ctx.fillText(Math.floor(kneaded), bx + bw - 40, 38);
  ctx.font = 'bold 13px system-ui'; ctx.fillText('/ 100', bx + bw, 37);
  // バー
  ctx.fillStyle = 'rgba(0,0,0,.35)'; roundRect(ctx, bx, by, bw, bh, 9); ctx.fill();
  const g = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  g.addColorStop(0, '#d8c39a'); g.addColorStop(0.5, '#f4d28a'); g.addColorStop(1, '#ffb347');
  ctx.fillStyle = g; roundRect(ctx, bx, by, Math.max(bh, bw * kneaded / 100), bh, 9); ctx.fill();
  // 段階の目盛り
  ctx.fillStyle = 'rgba(255,255,255,.5)';
  for (const st of STAGES) if (st.at > 0 && st.at < 100) ctx.fillRect(bx + bw * st.at / 100 - 1, by + 3, 2, bh - 6);
  // こね速度インジケータ
  if (flowRate > 0.3 && !done) {
    ctx.fillStyle = `rgba(255,220,150,${Math.min(0.9, flowRate * 0.15)})`;
    ctx.beginPath(); ctx.arc(bx + bw * kneaded / 100, by + bh / 2, 6 + Math.min(10, flowRate), 0, Math.PI * 2); ctx.fill();
  }
  const st = stageOf(kneaded);
  ctx.textAlign = 'left'; ctx.font = 'bold 13px system-ui'; ctx.fillStyle = '#ffe2a8';
  ctx.fillText(st.name, bx, by + bh + 22);
  const warn = !!failing;
  ctx.font = '12px system-ui'; ctx.fillStyle = warn ? '#ff9b80' : '#f3e6d6';
  const tip = failing ? '失敗… 新しい生地が来るよ'
    : dropT < 1 ? '新しい生地…'
    : '引っぱって緑〜黄で離す！ 赤はちぎれる';
  ctx.fillText(done ? st.tip : tip, bx + ctx.measureText(st.name).width + 16, by + bh + 22);
  ctx.textAlign = 'right';
  const t = startTime === null ? 0 : (done ? endTime : now) - startTime;
  ctx.fillText((fails ? '失敗 ' + fails + '　' : '') + '⏱ ' + fmtTime(t), bx + bw, by + bh + 22);

  if (done) {
    const a = Math.min(1, (now - doneAt) / 600);
    ctx.save();
    ctx.globalAlpha = a;
    ctx.fillStyle = 'rgba(40,25,15,.6)';
    roundRect(ctx, W / 2 - 190, H * 0.72 - 50, 380, 100, 16); ctx.fill();
    ctx.fillStyle = '#fff3e0'; ctx.textAlign = 'center';
    ctx.font = 'bold 32px system-ui'; ctx.fillText('こね上がり！', W / 2, H * 0.72 - 6);
    ctx.font = '14px system-ui';
    ctx.fillText('タイム ' + fmtTime(endTime - startTime) + '　　Start / R でもう一度', W / 2, H * 0.72 + 26);
    ctx.restore();
  }
}
function roundRect(c, x, y, w, h, r) {
  c.beginPath();
  c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r); c.arcTo(x + w, y + h, x, y + h, r);
  c.arcTo(x, y + h, x, y, r); c.arcTo(x, y, x + w, y, r); c.closePath();
}

// =====================================================================
// ループ
// =====================================================================
makeDough();
let last = performance.now();
function loop(now) {
  const dt = Math.min(0.033, (now - last) / 1000); last = now;
  updateHands(dt);
  if (parts.length && dropT >= 1) stepDough(dt);
  updateFail(dt);
  if (respawnT > 0) { respawnT -= dt; if (respawnT <= 0) { respawnT = 0; spawnDough(true); } }
  updateDrop(dt);
  updateFx(dt);
  drawTable(now);
  drawDough();
  drawHands();
  drawFx();
  drawUI(now);
  drawGauge(dt);
  hud.textContent =
    (padName ? '🎮 ' + padName.slice(0, 36) : '🎮 未接続（A ボタンなどを押すと認識）') + '\n' +
    'スティック: 手を移動 / LT・RT: つかむ / Start・R: やり直し / I: 入力表示' +
    (showDebug && padDebug ? '\n' + padDebug : '');
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);
</script>
