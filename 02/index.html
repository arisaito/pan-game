<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>02 ベルトコンベア生地</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #2a1d13; }
  canvas { display: block; }
  body { font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif; }
  #hud {
    position: fixed; top: 14px; left: 50%; transform: translateX(-50%);
    font-weight: bold; font-size: 20px; line-height: 1.3;
    color: #fff8ec; text-shadow: 0 2px 4px rgba(0,0,0,.6); text-align: center;
    pointer-events: none; white-space: nowrap;
  }
  #meter { width: 260px; height: 12px; margin: 6px auto 0; border-radius: 6px;
    background: rgba(0,0,0,.35); overflow: hidden; position: relative; }
  #meterFill { height: 100%; width: 0; background: linear-gradient(90deg,#f6c66b,#ffe9a8); transition: width .25s; }
  #meterLine { position: absolute; top: -2px; bottom: -2px; width: 2px; background: #fff; opacity: .8; }
  #hint {
    position: fixed; bottom: 6px; left: 50%; transform: translateX(-50%);
    font-size: 13px; line-height: 1.4; color: #fff8ecb0; width: 90%;
    text-shadow: 0 1px 3px rgba(0,0,0,.6); text-align: center; pointer-events: none;
  }
  #result {
    position: fixed; inset: 0; display: none; align-items: center; justify-content: center;
    background: rgba(40,25,12,.72); backdrop-filter: blur(3px);
  }
  #result.show { display: flex; animation: fade .4s ease-out; }
  @keyframes fade { from { opacity: 0; transform: scale(.96); } to { opacity: 1; transform: none; } }
  #card {
    background: #fff8ec; color: #4a3220; border-radius: 22px; padding: 22px 30px 20px;
    width: min(440px, 88vw); text-align: center; box-shadow: 0 16px 50px rgba(0,0,0,.5);
  }
  #rTag { display: inline-block; padding: 4px 16px; border-radius: 999px; font-weight: bold;
    font-size: 15px; color: #fff; letter-spacing: 2px; }
  #rTitle { font-size: 30px; font-weight: bold; margin: 8px 0 2px; }
  #rComment { font-size: 15px; color: #7a5a40; margin-bottom: 6px; min-height: 1.4em; }
  #bread { display: block; margin: 4px auto; }
  #rScore { font-size: 18px; font-weight: bold; margin: 4px 0 8px; }
  #rItems { font-size: 14px; color: #6a4a30; line-height: 1.7; }
  #rItems .bad { color: #c0392b; font-weight: bold; }
  #rRetry { margin-top: 12px; font-size: 13px; color: #9a7a5a; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud"><div id="hudText"></div><div id="meter"><div id="meterFill"></div><div id="meterLine"></div></div></div>
<div id="hint"></div>
<div id="result"><div id="card">
  <div id="rTag"></div>
  <div id="rTitle"></div>
  <div id="rComment"></div>
  <canvas id="bread" width="300" height="170"></canvas>
  <div id="rScore"></div>
  <div id="rItems"></div>
  <div id="rRetry">Aボタン / Rキー / クリック でもう一度</div>
</div></div>
<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');
  const $ = id => document.getElementById(id);

  // ---- 調整用パラメータ ----
  const GOAL = 10;          // こね回数
  const DEAD = 0.18;        // スティックを「離した」とみなす閾値
  const MIN_PULL = 0.4;     // これ以上引いてから離すと発射
  const MAX_SPEED = 2600;   // px/s
  const FRICTION = 2.2;     // ベルトとの摩擦（大きいほどすぐベルトの速さに馴染む）
  const BOUNCE = 0.55;
  const BELT_BASE = 0.10;   // ベルト速度（画面の高さ比 / 秒）
  const BELT_UP = 0.015;    // こねるごとの加速
  const START_SCORE = 30;
  const KNEAD_SCORE = 3;
  const PASS = 70;
  const ITEM_INTERVAL = 1.3;
  const MAX_ITEMS = 5;

  const GOOD = [
    { e: '🧂', n: '塩',     s: 10 },
    { e: '🍬', n: '砂糖',   s: 10 },
    { e: '🧈', n: 'バター', s: 12 },
    { e: '🥛', n: '牛乳',   s: 10 },
    { e: '🥚', n: '卵',     s: 10 },
    { e: '🍯', n: 'はちみつ', s: 20, rare: true },
  ];
  const BAD = [
    { e: '🧦', n: '靴下',   s: -25, c: '靴下の香りがする…' },
    { e: '🐟', n: '生魚',   s: -20, c: 'なんだか生臭い…' },
    { e: '🌶️', n: '唐辛子', s: -20, c: '口から火が出る！' },
    { e: '🧼', n: '石けん', s: -25, c: 'あわあわ…' },
    { e: '🔩', n: 'ネジ',   s: -30, c: '歯が欠けた！' },
    { e: '🐛', n: 'いもむし', s: -30, c: '…なにか動いた？' },
  ];

  let W = 1, H = 1, board, tile;

  function resize() {
    W = cv.width = Math.max(1, innerWidth);
    H = cv.height = Math.max(1, innerHeight);
    const mx = Math.min(W, H) * 0.08;
    const top = Math.min(W, H) * 0.06;
    // 下は奈落（床）を見せるために少し空ける
    board = { x: mx, y: top, w: W - mx * 2, h: H - top - Math.min(W, H) * 0.12 };
    buildTile();
  }

  // ---- 流れる板のタイル ----
  function buildTile() {
    tile = document.createElement('canvas');
    tile.width = Math.max(1, board.w | 0); tile.height = Math.max(1, board.h | 0);
    const b = tile.getContext('2d');
    b.fillStyle = '#d9ab70'; b.fillRect(0, 0, tile.width, tile.height);
    let seed = 7;
    const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
    for (let i = 0; i < 60; i++) {
      const y0 = rnd() * tile.height;
      const amp = 2 + rnd() * 8, freq = 0.002 + rnd() * 0.006, ph = rnd() * 6;
      b.strokeStyle = `rgba(${120 + rnd() * 40 | 0},${70 + rnd() * 30 | 0},30,${0.06 + rnd() * 0.12})`;
      b.lineWidth = 1 + rnd() * 2.5;
      b.beginPath();
      for (let x = 0; x <= tile.width; x += 8) {
        const y = y0 + Math.sin(x * freq + ph) * amp + Math.sin(x * freq * 3.1) * amp * 0.3;
        x === 0 ? b.moveTo(x, y) : b.lineTo(x, y);
      }
      b.stroke();
    }
    // 板の継ぎ目（流れてるのが分かるように）
    const seams = Math.max(3, Math.round(tile.height / 140));
    for (let i = 0; i < seams; i++) {
      const y = i * tile.height / seams;
      b.fillStyle = 'rgba(90,55,25,.35)'; b.fillRect(0, y, tile.width, 3);
      b.fillStyle = 'rgba(255,235,200,.25)'; b.fillRect(0, y + 3, tile.width, 2);
    }
    for (let i = 0; i < 1200; i++) {
      b.fillStyle = `rgba(255,252,240,${rnd() * 0.25})`;
      b.beginPath(); b.arc(rnd() * tile.width, rnd() * tile.height, rnd() * 2.2, 0, 7); b.fill();
    }
  }

  // ---- 状態 ----
  const N = 36;
  let dough, count, done, particles, splats, peak, pullVec, shake;
  let items, itemTimer, collected, score, popups, resultShown, finishTimer;
  let scroll, belt, fell, fallT;

  function reset() {
    dough = {
      x: W / 2, y: board.y + board.h * 0.4, vx: 0, vy: 0,
      r: Math.min(W, H) * 0.08,
      lumps: Array.from({ length: N }, () => Math.random()),
      squash: 0, squashAng: 0, wobble: 0, rot: 0,
      specks: [],
    };
    count = 0; done = false; particles = []; splats = [];
    peak = { x: 0, y: 0, m: 0 }; pullVec = { x: 0, y: 0 };
    shake = 0;
    items = []; itemTimer = 0.6; collected = []; score = START_SCORE; popups = [];
    resultShown = false; finishTimer = 0;
    scroll = 0; belt = 0; fell = false; fallT = 0;
    $('result').classList.remove('show');
  }

  // ---- 入力 ----
  const mouse = { down: false, sx: 0, sy: 0, x: 0, y: 0 };
  cv.addEventListener('pointerdown', e => {
    mouse.down = true; mouse.sx = mouse.x = e.clientX; mouse.sy = mouse.y = e.clientY;
  });
  addEventListener('pointermove', e => { mouse.x = e.clientX; mouse.y = e.clientY; });
  addEventListener('pointerup', e => {
    if (!mouse.down) return;
    mouse.down = false;
    const R = Math.min(W, H) * 0.25;
    const x = (e.clientX - mouse.sx) / R, y = (e.clientY - mouse.sy) / R;
    const raw = Math.hypot(x, y), m = Math.min(1, raw);
    if (m > peak.m && raw > 0) peak = { x: x / raw * m, y: y / raw * m, m };
  });
  addEventListener('keydown', e => { if (e.key === 'r' || e.key === 'R') reset(); });
  $('result').addEventListener('click', () => { if (resultShown) reset(); });

  let lastA = false;
  function readStick() {
    const pads = navigator.getGamepads ? navigator.getGamepads() : [];
    for (const p of pads) {
      if (!p) continue;
      const a = p.buttons[0] && p.buttons[0].pressed;
      if (a && !lastA && resultShown) reset();
      lastA = a;
      let x = p.axes[0] || 0, y = p.axes[1] || 0;
      const rx = p.axes[2] || 0, ry = p.axes[3] || 0;
      if (Math.hypot(rx, ry) > Math.hypot(x, y)) { x = rx; y = ry; }
      return { x, y, pad: true };
    }
    if (mouse.down) {
      const R = Math.min(W, H) * 0.25;
      let x = (mouse.x - mouse.sx) / R, y = (mouse.y - mouse.sy) / R;
      const m = Math.hypot(x, y);
      if (m > 1) { x /= m; y /= m; }
      return { x, y, pad: false };
    }
    return { x: 0, y: 0, pad: false };
  }

  // ---- ループ ----
  let last = performance.now();
  function frame(now) {
    requestAnimationFrame(frame);
    const dt = Math.min(0.033, (now - last) / 1000);
    last = now;
    if (W !== innerWidth || H !== innerHeight) onResize();
    const s = readStick();
    update(dt, s);
    draw(s);
  }

  function update(dt, s) {
    const d = dough;
    const m = Math.hypot(s.x, s.y);

    // ベルト速度：こねるほど速く、完成したら止まる
    const target = done ? 0 : H * (BELT_BASE + BELT_UP * count);
    belt += (target - belt) * Math.min(1, dt * (done ? 3 : 1.5));
    scroll = (scroll + belt * dt) % Math.max(1, board.h);

    if (!done) {
      if (m > DEAD) {
        pullVec.x = s.x; pullVec.y = s.y;
        if (m >= peak.m * 0.9) peak = { x: s.x, y: s.y, m };
      } else {
        if (peak.m > MIN_PULL) launch(peak);
        peak = { x: 0, y: 0, m: 0 };
        pullVec.x = pullVec.y = 0;
      }
    } else {
      pullVec.x = pullVec.y = 0; peak = { x: 0, y: 0, m: 0 };
    }

    if (fell) {
      // 落下アニメ
      fallT += dt;
      d.vy += 2600 * dt;
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.vx *= 0.98;
      d.rot += dt * 4;
    } else {
      // ベルトに引きずられる：速度がベルト速度に近づく
      const k = Math.exp(-FRICTION * dt);
      d.vx = d.vx * k;
      d.vy = belt + (d.vy - belt) * k;
      d.x += d.vx * dt; d.y += d.vy * dt;
      d.rot += d.vx * 0.0006 * dt * 60;

      const pad = d.r * 0.9;
      let hit = 0;
      if (d.x < board.x + pad) { d.x = board.x + pad; hit = Math.abs(d.vx); d.vx = Math.abs(d.vx) * BOUNCE; d.squashAng = 0; }
      if (d.x > board.x + board.w - pad) { d.x = board.x + board.w - pad; hit = Math.abs(d.vx); d.vx = -Math.abs(d.vx) * BOUNCE; d.squashAng = 0; }
      if (d.y < board.y + pad) { d.y = board.y + pad; hit = Math.abs(d.vy); d.vy = Math.abs(d.vy) * BOUNCE; d.squashAng = Math.PI / 2; }
      // 下は壁なし → 端を越えたら落ちる
      if (d.y > board.y + board.h + d.r * 0.2) fall();
      if (hit > 150) {
        d.squash = -Math.min(0.45, hit / 3000);
        d.wobble = 1;
        shake = Math.min(14, hit / 160);
        puff(d.x, d.y, Math.min(30, hit / 60));
        splats.push({ x: d.x, y: d.y, r: d.r * (0.6 + hit / 4000), a: 0.18 });
      }
      const rel = Math.hypot(d.vx, d.vy - belt);
      if (rel > 200 && !(pullVec.x || pullVec.y)) { d.squash = Math.max(d.squash, Math.min(0.25, rel / 8000)); d.squashAng = Math.atan2(d.vy - belt, d.vx); }

      // 完成：10回こねて勢いが落ち着いたら
      if (!done && count >= GOAL && rel < 80) finish();
    }

    if (!done && (pullVec.x || pullVec.y)) {
      const pm = Math.hypot(pullVec.x, pullVec.y);
      d.squash = pm * 0.45;
      d.squashAng = Math.atan2(pullVec.y, pullVec.x);
    } else {
      d.squash *= Math.exp(-6 * dt);
    }
    d.wobble *= Math.exp(-4 * dt);
    shake *= Math.exp(-12 * dt);

    // 食材：上の方に出てきて、ベルトで流れてくる
    if (!done) {
      itemTimer -= dt;
      if (itemTimer <= 0 && items.length < MAX_ITEMS) { spawnItem(); itemTimer = ITEM_INTERVAL * (0.7 + Math.random() * 0.6); }
    }
    for (const it of items) {
      it.t += dt;
      if (!it.got) {
        it.y += belt * dt;
        if (!fell && Math.hypot(it.x - d.x, it.y - d.y) < d.r + it.r * 0.6) pickup(it);
      } else it.gotT += dt;
    }
    items = items.filter(it => it.got ? it.gotT < 0.35 : it.y - it.r < board.y + board.h);

    for (const sp of splats) { sp.a -= dt * 0.08; sp.y += belt * dt; }
    splats = splats.filter(s => s.a > 0 && s.y - s.r < board.y + board.h);

    if (done && !resultShown) {
      finishTimer += dt;
      if (finishTimer > (fell ? 1.0 : 1.2)) showResult();
    }

    for (const p of particles) {
      p.x += p.vx * dt; p.y += p.vy * dt;
      p.vx *= 0.92; p.vy *= 0.92; p.life -= dt;
    }
    particles = particles.filter(p => p.life > 0);
    for (const p of popups) { p.y -= 40 * dt; p.t += dt; }
    popups = popups.filter(p => p.t < 1.2);
  }

  function spawnItem() {
    let def;
    if (Math.random() < 0.4) def = BAD[Math.random() * BAD.length | 0];
    else {
      const pool = GOOD.filter(g => !g.rare || Math.random() < 0.25);
      def = pool[Math.random() * pool.length | 0];
    }
    const r = Math.min(W, H) * 0.045;
    const margin = r * 1.6;
    let x, y, tries = 0;
    do {
      x = board.x + margin + Math.random() * (board.w - margin * 2);
      y = board.y + margin + Math.random() * board.h * 0.3;
      tries++;
    } while (tries < 20 && (Math.hypot(x - dough.x, y - dough.y) < dough.r * 2.5 ||
             items.some(o => Math.hypot(o.x - x, o.y - y) < r * 3)));
    items.push({ ...def, bad: BAD.includes(def), x, y, r, t: 0, got: false, gotT: 0 });
  }

  function pickup(it) {
    it.got = true;
    collected.push(it);
    score += it.s;
    dough.wobble = 1;
    const good = !it.bad;
    popups.push({ x: it.x, y: it.y - it.r, t: 0, text: `${it.n} ${it.s > 0 ? '+' : ''}${it.s}`, good });
    const col = good ? 'rgba(255,215,120,.9)' : 'rgba(120,80,140,.9)';
    for (let i = 0; i < 4; i++) dough.specks.push({ a: Math.random() * 7, r: Math.random() * 0.7, c: col });
    if (it.bad) shake = 10;
    for (let i = 0; i < 14; i++) {
      const a = Math.random() * 7, sp = 80 + Math.random() * 200;
      particles.push({ x: it.x, y: it.y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.6, r: 2 + Math.random() * 2,
        col: good ? '255,230,140' : '150,90,170' });
    }
    rumble(good ? 0.2 : 0.8, good ? 60 : 200);
  }

  function launch(p) {
    const d = dough;
    const power = Math.min(1, p.m);
    // ベルト上での相対速度として発射
    d.vx = -p.x / p.m * power * MAX_SPEED;
    d.vy = belt - p.y / p.m * power * MAX_SPEED;
    d.wobble = 1;
    count = Math.min(GOAL, count + 1);
    score += KNEAD_SCORE;
    const smooth = count / GOAL;
    d.lumps = d.lumps.map(v => v * (1 - smooth * 0.5) + Math.random() * (1 - smooth) * 0.5);
    puff(d.x, d.y, 12);
    rumble(0.6 * power, 120);
  }

  function fall() {
    fell = true; done = true; finishTimer = 0;
    dough.vy = Math.max(dough.vy, 300);
    shake = 8;
    rumble(1, 400);
  }

  function rumble(strong, ms) {
    if (!navigator.getGamepads) return;
    for (const pad of navigator.getGamepads()) {
      if (pad && pad.vibrationActuator) {
        pad.vibrationActuator.playEffect('dual-rumble', { duration: ms, strongMagnitude: strong, weakMagnitude: 0.4 }).catch(() => {});
      }
    }
  }

  function finish() {
    done = true; finishTimer = 0;
    dough.wobble = 1;
    puff(dough.x, dough.y, 60);
  }

  function puff(x, y, n) {
    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = 60 + Math.random() * 260;
      particles.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, life: 0.5 + Math.random() * 0.7, r: 1.5 + Math.random() * 3 });
    }
  }

  // ---- 結果画面 ----
  function showResult() {
    resultShown = true;
    const bads = collected.filter(c => c.bad);
    const goods = collected.filter(c => !c.bad);
    const sc = fell ? 0 : Math.max(0, Math.min(100, score));
    const ok = !fell && sc >= PASS;
    let title, comment;
    if (fell) { title = '生地が落ちた…'; comment = `床にべちゃっ。（${count}回目まで こねた）`; }
    else if (ok && sc >= 95) { title = '極上パン！'; comment = 'お店に並べられるレベル。ふわっふわ！'; }
    else if (ok) { title = 'おいしいパン'; comment = bads.length ? 'ちょっと変な味もするけど…まあ合格！' : 'いい香り。ちゃんとパンだ！'; }
    else if (bads.length) {
      const worst = bads.reduce((a, b) => a.s < b.s ? a : b);
      title = '謎のパン…'; comment = worst.c;
    } else { title = '味気ないパン'; comment = '材料が足りなかったみたい…'; }

    $('rTag').textContent = ok ? '成功' : '失敗';
    $('rTag').style.background = ok ? '#e0962f' : '#8a6d5a';
    $('rTitle').textContent = title;
    $('rComment').textContent = comment;
    $('rScore').textContent = fell ? '完成度 0 / 100（落下）' : `完成度 ${sc} / 100（合格 ${PASS}）`;
    const list = arr => {
      const m = new Map();
      for (const c of arr) m.set(c.n, { e: c.e, n: c.n, k: (m.get(c.n)?.k || 0) + 1 });
      return [...m.values()].map(v => `${v.e}${v.n}${v.k > 1 ? '×' + v.k : ''}`).join('　');
    };
    $('rItems').innerHTML =
      `こね ${count}回 +${count * KNEAD_SCORE}<br>` +
      (goods.length ? `入れた材料：${list(goods)}<br>` : '入れた材料：なし<br>') +
      (bads.length ? `<span class="bad">入っちゃった：${list(bads)}</span>` : '');
    if (fell) drawSplat(); else drawBread(sc, ok, bads);
    $('result').classList.add('show');
  }

  function drawSplat() {
    const c = $('bread'), b = c.getContext('2d');
    b.clearRect(0, 0, c.width, c.height);
    // 床
    b.fillStyle = '#6b5544'; b.fillRect(0, 120, c.width, 50);
    b.fillStyle = '#5a4638';
    for (let x = 0; x < c.width; x += 50) b.fillRect(x, 120, 2, 50);
    // べちゃっと潰れた生地
    b.fillStyle = '#efdcb8';
    b.beginPath();
    for (let i = 0; i <= 24; i++) {
      const a = i / 24 * Math.PI * 2;
      const r = 1 + Math.sin(a * 5) * 0.15 + Math.sin(a * 3 + 1) * 0.1;
      b.lineTo(150 + Math.cos(a) * 90 * r, 128 + Math.sin(a) * 22 * r);
    }
    b.fill();
    b.fillStyle = 'rgba(255,255,255,.4)';
    b.beginPath(); b.ellipse(125, 122, 30, 6, 0, 0, 7); b.fill();
    // ほこり
    b.fillStyle = 'rgba(80,70,60,.5)';
    for (let i = 0; i < 18; i++) { b.beginPath(); b.arc(80 + Math.random() * 140, 115 + Math.random() * 25, 1.5, 0, 7); b.fill(); }
    b.font = '34px serif'; b.textAlign = 'center'; b.fillStyle = '#000';
    b.fillText('💥', 238, 100);
  }

  function drawBread(sc, ok, bads) {
    const c = $('bread'), b = c.getContext('2d');
    b.clearRect(0, 0, c.width, c.height);
    const cx = 150, cy = 105;
    const k = 0.55 + sc / 100 * 0.5;
    const w = 120 * k, h = 70 * k;
    b.fillStyle = '#e8dccb';
    b.beginPath(); b.ellipse(cx, cy + h * 0.55, 140, 22, 0, 0, 7); b.fill();
    const top = ok ? '#c8792b' : '#7a4e2e', mid = ok ? '#e2a04f' : '#9a6a44';
    const g = b.createLinearGradient(0, cy - h, 0, cy + h * 0.5);
    g.addColorStop(0, top); g.addColorStop(1, mid);
    b.fillStyle = g;
    b.beginPath();
    b.moveTo(cx - w, cy + h * 0.45);
    b.bezierCurveTo(cx - w * 1.05, cy - h * 0.9, cx + w * 1.05, cy - h * 0.9, cx + w, cy + h * 0.45);
    b.closePath(); b.fill();
    b.strokeStyle = ok ? 'rgba(255,230,170,.8)' : 'rgba(60,35,20,.6)'; b.lineWidth = 5; b.lineCap = 'round';
    for (let i = -1; i <= 1; i++) {
      b.beginPath();
      b.moveTo(cx + i * w * 0.45 - 14, cy - h * 0.25);
      b.quadraticCurveTo(cx + i * w * 0.45, cy - h * 0.45, cx + i * w * 0.45 + 14, cy - h * 0.2);
      b.stroke();
    }
    b.fillStyle = `rgba(255,255,255,${ok ? 0.25 : 0.08})`;
    b.beginPath(); b.ellipse(cx - w * 0.35, cy - h * 0.35, w * 0.25, h * 0.1, -0.3, 0, 7); b.fill();
    b.font = '30px serif'; b.textAlign = 'center'; b.textBaseline = 'middle';
    b.fillStyle = '#000'; // 絵文字は fillStyle の透明度を受けるので不透明に戻す
    bads.slice(0, 5).forEach((it, i) => {
      const t = (i + 0.5) / Math.min(5, bads.length);
      const x = cx - w * 0.8 + t * w * 1.6;
      const y = cy - h * 0.55 + Math.abs(t - 0.5) * h * 0.6;
      b.save(); b.translate(x, y); b.rotate((i % 2 ? 1 : -1) * 0.35);
      b.fillText(it.e, 0, 0); b.restore();
    });
    if (!ok) {
      b.strokeStyle = 'rgba(120,110,100,.5)'; b.lineWidth = 3;
      for (let i = 0; i < 3; i++) {
        b.beginPath();
        const x = cx - 30 + i * 30;
        b.moveTo(x, cy - h - 4);
        b.bezierCurveTo(x - 10, cy - h - 18, x + 10, cy - h - 28, x, cy - h - 42);
        b.stroke();
      }
    } else {
      b.fillStyle = '#ffd86b';
      [[cx - w - 8, cy - h * 0.6], [cx + w + 6, cy - h * 0.8], [cx + w * 0.2, cy - h - 14]].forEach(([x, y]) => {
        b.beginPath();
        for (let i = 0; i < 8; i++) { const a = i / 8 * 7, r = i % 2 ? 3 : 10; b.lineTo(x + Math.cos(a) * r, y + Math.sin(a) * r); }
        b.fill();
      });
    }
  }

  function roundRect(c, x, y, w, h, r) {
    c.beginPath();
    c.moveTo(x + r, y); c.arcTo(x + w, y, x + w, y + h, r);
    c.arcTo(x + w, y + h, x, y + h, r); c.arcTo(x, y + h, x, y, r);
    c.arcTo(x, y, x + w, y, r); c.closePath();
  }

  // ---- 描画 ----
  function drawBelt() {
    const t = performance.now() / 1000;
    // 床（奈落側）
    ctx.fillStyle = '#2a1d13'; ctx.fillRect(0, 0, W, H);
    const fy = board.y + board.h;
    const fg = ctx.createLinearGradient(0, fy, 0, H);
    fg.addColorStop(0, '#120c07'); fg.addColorStop(1, '#3a2a1c');
    ctx.fillStyle = fg; ctx.fillRect(0, fy, W, H - fy);

    // サイドレール
    const rw = Math.min(W, H) * 0.03;
    ctx.fillStyle = '#6d6d72';
    ctx.fillRect(board.x - rw, board.y - rw * 0.6, rw, board.h + rw * 0.6);
    ctx.fillRect(board.x + board.w, board.y - rw * 0.6, rw, board.h + rw * 0.6);
    ctx.fillStyle = 'rgba(255,255,255,.25)';
    ctx.fillRect(board.x - rw, board.y - rw * 0.6, rw * 0.3, board.h + rw * 0.6);
    ctx.fillRect(board.x + board.w, board.y - rw * 0.6, rw * 0.3, board.h + rw * 0.6);

    // 流れる板
    ctx.save();
    ctx.beginPath(); ctx.rect(board.x, board.y, board.w, board.h); ctx.clip();
    const off = scroll;
    ctx.drawImage(tile, board.x, board.y + off - board.h);
    ctx.drawImage(tile, board.x, board.y + off);
    // 上下の陰影（ローラーに巻き込まれる感じ）
    const sh = board.h * 0.08;
    let g = ctx.createLinearGradient(0, board.y, 0, board.y + sh);
    g.addColorStop(0, 'rgba(0,0,0,.45)'); g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(board.x, board.y, board.w, sh);
    g = ctx.createLinearGradient(0, board.y + board.h - sh, 0, board.y + board.h);
    g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(0,0,0,.5)');
    ctx.fillStyle = g; ctx.fillRect(board.x, board.y + board.h - sh, board.w, sh);
    ctx.restore();

    // 下端の危険ゾーン（生地が近いと赤く光る）
    const danger = Math.max(0, Math.min(1, (dough.y - (board.y + board.h * 0.6)) / (board.h * 0.35)));
    if (!done && danger > 0) {
      const a = danger * (0.35 + Math.sin(t * 12) * 0.15);
      g = ctx.createLinearGradient(0, board.y + board.h * 0.75, 0, board.y + board.h);
      g.addColorStop(0, 'rgba(255,60,40,0)'); g.addColorStop(1, `rgba(255,60,40,${a})`);
      ctx.fillStyle = g; ctx.fillRect(board.x, board.y + board.h * 0.75, board.w, board.h * 0.25);
    }

    // 下のローラー
    const rr = Math.min(W, H) * 0.025;
    const rg = ctx.createLinearGradient(0, fy - rr, 0, fy + rr);
    rg.addColorStop(0, '#9a9aa0'); rg.addColorStop(0.5, '#d8d8de'); rg.addColorStop(1, '#55555a');
    ctx.fillStyle = rg;
    ctx.fillRect(board.x - rw, fy - rr * 0.4, board.w + rw * 2, rr * 1.4);
    // 回転感のある縞
    ctx.fillStyle = 'rgba(0,0,0,.18)';
    const stripe = 26, so = (scroll * 0.8) % stripe;
    for (let x = board.x - rw - stripe + so; x < board.x + board.w + rw; x += stripe) {
      ctx.fillRect(Math.max(board.x - rw, x), fy - rr * 0.4, 6, rr * 1.4);
    }
    // 上のローラー
    ctx.fillStyle = rg;
    ctx.fillRect(board.x - rw, board.y - rr * 0.9, board.w + rw * 2, rr * 1.2);
  }

  function draw(s) {
    const t = performance.now() / 1000;
    ctx.save();
    if (shake > 0.3) ctx.translate((Math.random() - .5) * shake, (Math.random() - .5) * shake);
    drawBelt();

    ctx.save();
    ctx.beginPath(); ctx.rect(board.x, board.y, board.w, board.h); ctx.clip();
    for (const sp of splats) {
      ctx.fillStyle = `rgba(255,250,235,${sp.a})`;
      ctx.beginPath(); ctx.arc(sp.x, sp.y, sp.r, 0, 7); ctx.fill();
    }
    ctx.restore();

    // 食材
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    for (const it of items) {
      let a = 1, sc = 1, x = it.x, y = it.y;
      if (it.got) {
        const k = it.gotT / 0.35;
        x += (dough.x - x) * k; y += (dough.y - y) * k; sc = 1 - k; a = 1 - k;
      } else {
        sc = Math.min(1, it.t / 0.25);
      }
      ctx.globalAlpha = a;
      ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc);
      ctx.fillStyle = 'rgba(60,35,15,.22)';
      ctx.beginPath(); ctx.ellipse(3, it.r * 0.75, it.r * 0.9, it.r * 0.35, 0, 0, 7); ctx.fill();
      ctx.fillStyle = 'rgba(255,250,240,.9)';
      ctx.beginPath(); ctx.arc(0, 0, it.r, 0, 7); ctx.fill();
      ctx.fillStyle = '#000';
      ctx.font = `${it.r * 1.25}px serif`;
      ctx.fillText(it.e, 0, 2);
      ctx.font = `bold ${Math.max(11, it.r * 0.42)}px "Hiragino Sans", sans-serif`;
      ctx.fillStyle = '#5a3a20';
      ctx.fillText(it.n, 0, it.r + 12);
      ctx.restore();
      ctx.globalAlpha = 1;
    }

    const d = dough;
    if (!done && (pullVec.x || pullVec.y)) {
      const raw = Math.hypot(pullVec.x, pullVec.y), pm = Math.min(1, raw);
      const ax = -pullVec.x / raw, ay = -pullVec.y / raw;
      const len = d.r * 1.3 + pm * Math.min(W, H) * 0.35;
      const col = pm > MIN_PULL ? 'rgba(255,255,255,.8)' : 'rgba(255,255,255,.3)';
      ctx.strokeStyle = col; ctx.fillStyle = col;
      ctx.lineWidth = 4; ctx.setLineDash([10, 12]);
      ctx.beginPath(); ctx.moveTo(d.x + ax * d.r * 1.2, d.y + ay * d.r * 1.2);
      ctx.lineTo(d.x + ax * len, d.y + ay * len); ctx.stroke();
      ctx.setLineDash([]);
      const hx = d.x + ax * len, hy = d.y + ay * len, an = Math.atan2(ay, ax);
      ctx.beginPath();
      ctx.moveTo(hx + Math.cos(an) * 16, hy + Math.sin(an) * 16);
      ctx.lineTo(hx + Math.cos(an + 2.5) * 14, hy + Math.sin(an + 2.5) * 14);
      ctx.lineTo(hx + Math.cos(an - 2.5) * 14, hy + Math.sin(an - 2.5) * 14);
      ctx.fill();
    }

    for (const p of particles) {
      ctx.fillStyle = `rgba(${p.col || '255,253,245'},${Math.min(1, p.life) * 0.8})`;
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fill();
    }

    drawDough(d);

    for (const p of popups) {
      ctx.globalAlpha = Math.min(1, (1.2 - p.t) * 2);
      ctx.font = 'bold 22px "Hiragino Maru Gothic ProN", sans-serif';
      ctx.lineWidth = 5; ctx.strokeStyle = 'rgba(60,30,10,.7)';
      ctx.strokeText(p.text, p.x, p.y);
      ctx.fillStyle = p.good ? '#ffe680' : '#ff8a8a';
      ctx.fillText(p.text, p.x, p.y);
      ctx.globalAlpha = 1;
    }
    ctx.restore();

    const sc = Math.max(0, Math.min(100, score));
    $('hudText').innerHTML = fell
      ? '😱 落ちた！'
      : done ? '🍞 焼き上がり…'
      : `こね ${count} / ${GOAL}　<span style="font-size:15px">完成度 ${sc}</span>`;
    $('meterFill').style.width = sc + '%';
    $('meterLine').style.left = PASS + '%';
    $('hint').textContent = s.pad
      ? 'スティックを傾けて離す！ 下に流されて落ちたらアウト。いい材料だけ拾おう'
      : 'マウスでドラッグして離す（パッドはボタンを一度押すと認識）。落ちたらアウト';
  }

  function drawDough(d) {
    const t = performance.now() / 1000;
    const smooth = count / GOAL;
    ctx.save();
    ctx.translate(d.x, d.y);
    if (fell) {
      const k = Math.max(0.3, 1 - fallT * 0.6);
      ctx.scale(k, k);
    } else {
      ctx.fillStyle = 'rgba(60,35,15,.28)';
      ctx.beginPath(); ctx.ellipse(6, d.r * 0.35, d.r * 1.05, d.r * 0.75, 0, 0, 7); ctx.fill();
    }

    ctx.rotate(d.squashAng);
    const sq = d.squash + Math.sin(t * 22) * d.wobble * 0.08;
    ctx.scale(1 + sq, 1 / (1 + sq));
    ctx.rotate(-d.squashAng + d.rot);

    const rough = 0.22 * (1 - smooth) + 0.02;
    const pts = [];
    for (let i = 0; i < N; i++) {
      const a = i / N * Math.PI * 2;
      const lump = (d.lumps[(i - 1 + N) % N] + d.lumps[i] * 2 + d.lumps[(i + 1) % N]) / 4;
      const rr = d.r * (1 - rough / 2 + lump * rough);
      pts.push([Math.cos(a) * rr, Math.sin(a) * rr]);
    }
    const path = () => {
      ctx.beginPath();
      for (let i = 0; i < N; i++) {
        const p = pts[i], q = pts[(i + 1) % N];
        const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
        i === 0 ? ctx.moveTo(mx, my) : ctx.quadraticCurveTo(p[0], p[1], mx, my);
      }
      const p = pts[0], q = pts[1];
      ctx.quadraticCurveTo(p[0], p[1], (p[0] + q[0]) / 2, (p[1] + q[1]) / 2);
      ctx.closePath();
    };

    const c0 = [228 + smooth * 22, 205 + smooth * 30, 160 + smooth * 55];
    const g = ctx.createRadialGradient(-d.r * 0.3, -d.r * 0.4, d.r * 0.1, 0, 0, d.r * 1.15);
    g.addColorStop(0, `rgb(${Math.min(255, c0[0] + 20)},${Math.min(255, c0[1] + 22)},${Math.min(255, c0[2] + 25)})`);
    g.addColorStop(1, `rgb(${c0[0] - 30},${c0[1] - 35},${c0[2] - 40})`);
    path(); ctx.fillStyle = g; ctx.fill();

    ctx.save(); path(); ctx.clip();
    const spots = Math.round(40 * (1 - smooth));
    for (let i = 0; i < spots; i++) {
      const a = d.lumps[i % N] * 7 + i, rr = d.r * (0.2 + d.lumps[(i * 7) % N] * 0.7);
      ctx.fillStyle = i % 2 ? 'rgba(255,255,250,.45)' : 'rgba(170,130,80,.18)';
      ctx.beginPath(); ctx.arc(Math.cos(a) * rr, Math.sin(a) * rr, 2 + (i % 5), 0, 7); ctx.fill();
    }
    for (const sp of d.specks) {
      ctx.fillStyle = sp.c;
      ctx.beginPath(); ctx.arc(Math.cos(sp.a) * sp.r * d.r, Math.sin(sp.a) * sp.r * d.r, 3, 0, 7); ctx.fill();
    }
    ctx.fillStyle = `rgba(255,255,255,${0.1 + smooth * 0.35})`;
    ctx.beginPath(); ctx.ellipse(-d.r * 0.32, -d.r * 0.38, d.r * 0.35, d.r * 0.18, -0.5, 0, 7); ctx.fill();
    ctx.restore();

    ctx.strokeStyle = 'rgba(150,105,60,.35)'; ctx.lineWidth = 2;
    path(); ctx.stroke();
    ctx.restore();
  }

  function onResize() {
    if (!innerWidth || !innerHeight) return;
    const ox = W, oy = H;
    resize();
    if (dough) {
      dough.x = dough.x / ox * W; dough.y = dough.y / oy * H;
      dough.r = Math.min(W, H) * 0.08;
      for (const it of items) { it.x = it.x / ox * W; it.y = it.y / oy * H; it.r = Math.min(W, H) * 0.045; }
    }
  }
  addEventListener('resize', onResize);
  resize();
  reset();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
